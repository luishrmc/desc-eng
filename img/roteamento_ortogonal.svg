<svg xmlns="http://www.w3.org/2000/svg" width="460" height="365" viewBox="0 0 460 365">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="460" height="365" fill="#ffffff"/>

  <rect x="4" y="4" width="452" height="357" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="4" y="4" width="452" height="30" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="230" y="24" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Planta superior: Roteamento Ortogonal (2 camadas)</text>

  <!-- Indicador de direcoes ortogonais -->
  <rect x="18" y="41" width="424" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="230" y="57" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">
    Polissilício p<tspan baseline-shift="super" font-size="75%">+</tspan>: eixo vertical (&#8597;)
    &#160;&#160;|&#160;&#160;
    Alumínio: eixo horizontal (&#8596;)
  </text>

  <!-- Area do leiaute (oxido de campo) -->
  <rect x="18" y="72" width="424" height="218" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Difusao p+ ativa superior e inferior -->
  <rect x="52" y="105" width="174" height="34" rx="2" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/>
  <rect x="144" y="194" width="256" height="34" rx="2" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/>

  <!-- Trilhas verticais de Polissilicio p+ -->
  <rect x="106" y="79" width="22" height="178" fill="#fecdd3" fill-opacity="0.9" stroke="#9f1239" stroke-width="1.4"/>
  <rect x="198" y="79" width="22" height="178" fill="#fecdd3" fill-opacity="0.9" stroke="#9f1239" stroke-width="1.4"/>
  <rect x="366" y="79" width="22" height="178" fill="#fecdd3" fill-opacity="0.9" stroke="#9f1239" stroke-width="1.4"/>

  <!-- Destaque dos Transistores PMOS nos cruzamentos Poly x Difusao -->
  <rect x="104" y="103" width="26" height="38" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="3,2"/>
  <rect x="196" y="192" width="26" height="38" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- Contatos enterrados (Poly direto na difusao p+) -->
  <rect x="200" y="109" width="18" height="26" fill="#fed7aa" stroke="#9a3412" stroke-width="1.8"/>
  <line x1="200" y1="109" x2="218" y2="135" stroke="#9a3412" stroke-width="1.5"/>
  <line x1="218" y1="109" x2="200" y2="135" stroke="#9a3412" stroke-width="1.5"/>

  <rect x="368" y="198" width="18" height="26" fill="#fed7aa" stroke="#9a3412" stroke-width="1.8"/>
  <line x1="368" y1="198" x2="386" y2="224" stroke="#9a3412" stroke-width="1.5"/>
  <line x1="386" y1="198" x2="368" y2="224" stroke="#9a3412" stroke-width="1.5"/>

  <!-- Trilhas horizontais de Aluminio (2a camada superior) -->
  <rect x="32" y="83" width="396" height="16" fill="#cbd5e1" fill-opacity="0.86" stroke="#334155" stroke-width="1.4"/>
  <rect x="32" y="156" width="396" height="16" fill="#cbd5e1" fill-opacity="0.86" stroke="#334155" stroke-width="1.4"/>

  <!-- Vias metal-polissilicio -->
  <rect x="110" y="84" width="14" height="14" fill="#334155" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="117" cy="91" r="3" fill="#ffffff"/>

  <rect x="370" y="157" width="14" height="14" fill="#334155" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="377" cy="164" r="3" fill="#ffffff"/>

  <!-- Chamadas limpas dentro da planta superior -->
  <text x="64" y="95" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Via</text>
  <line x1="78" y1="91" x2="108" y2="91" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow-dark)"/>

  <text x="64" y="212" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0e7490">Transistor</text>
  <text x="64" y="227" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0e7490">PMOS</text>
  <line x1="74" y1="197" x2="112" y2="143" stroke="#0891b2" stroke-width="1.3" marker-end="url(#arrow-dark)"/>

  <text x="294" y="122" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#334155">Cruzamento isolado</text>
  <text x="294" y="137" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#475569">(sem túnel difuso)</text>
  <line x1="248" y1="140" x2="223" y2="156" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow-dark)"/>

  <text x="234" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9a3412">Contato enterrado (Poly + p<tspan baseline-shift="super" font-size="75%">+</tspan>)</text>
  <line x1="316" y1="262" x2="367" y2="225" stroke="#9a3412" stroke-width="1.3" marker-end="url(#arrow-dark)"/>

  <!-- Legenda inferior -->
  <rect x="18" y="296" width="424" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <rect x="30" y="307" width="14" height="12" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/>
  <text x="50" y="317" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Difusão p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <rect x="144" y="307" width="14" height="12" fill="#fecdd3" stroke="#9f1239" stroke-width="1.2"/>
  <text x="164" y="317" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Polissilício p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <rect x="276" y="307" width="14" height="12" fill="#cbd5e1" stroke="#334155" stroke-width="1.2"/>
  <text x="296" y="317" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Alumínio (2ª cam.)</text>

  <rect x="30" y="331" width="14" height="12" fill="none" stroke="#0891b2" stroke-width="1.6" stroke-dasharray="2,1.5"/>
  <text x="50" y="341" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Canal PMOS</text>

  <rect x="144" y="331" width="14" height="12" fill="#fed7aa" stroke="#9a3412" stroke-width="1.4"/>
  <line x1="144" y1="331" x2="158" y2="343" stroke="#9a3412" stroke-width="1.2"/>
  <line x1="158" y1="331" x2="144" y2="343" stroke="#9a3412" stroke-width="1.2"/>
  <text x="164" y="341" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Contato enterr.</text>

  <rect x="276" y="331" width="14" height="12" fill="#334155" stroke="#0f172a" stroke-width="1"/>
  <circle cx="283" cy="337" r="2.5" fill="#ffffff"/>
  <text x="296" y="341" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Via Al / Polissilício</text>
</svg>
