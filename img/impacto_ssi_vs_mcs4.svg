<svg xmlns="http://www.w3.org/2000/svg" width="520" height="440" viewBox="0 0 520 440">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="520" height="440" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- BLOCO SUPERIOR: ANTES (LOGICA DISCRETA CABEADA SSI/MSI)                -->
  <!-- ====================================================================== -->
  <rect x="12" y="10" width="496" height="172" rx="6" fill="#fff5f5" stroke="#dc2626" stroke-width="1.6"/>
  <rect x="12" y="10" width="496" height="32" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="260" y="31" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#991b1b">Antes: Lógica Discreta Cabeada (SSI/MSI)</text>

  <!-- Card 1 -->
  <rect x="24" y="54" width="144" height="72" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="96" y="83" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#991b1b">~90 chips TTL</text>
  <text x="96" y="105" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">em placa fixa</text>

  <line x1="170" y1="90" x2="184" y2="90" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Card 2 -->
  <rect x="188" y="54" width="144" height="72" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="260" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#991b1b">Função gravada</text>
  <text x="260" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">nas trilhas</text>
  <text x="260" y="112" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">e soldas</text>

  <line x1="334" y1="90" x2="348" y2="90" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Card 3 -->
  <rect x="352" y="54" width="144" height="72" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="424" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#991b1b">Alteração exige</text>
  <text x="424" y="94" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">redesenho</text>
  <text x="424" y="112" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">físico da placa</text>

  <!-- Faixa inferior de consequencias -->
  <rect x="24" y="138" width="472" height="32" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1.2"/>
  <text x="260" y="159" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#7f1d1d">Alto custo NRE e meses de desenvolvimento</text>

  <!-- ====================================================================== -->
  <!-- TRANSICAO CENTRAL                                                      -->
  <!-- ====================================================================== -->
  <line x1="260" y1="184" x2="260" y2="195" stroke="#1d4ed8" stroke-width="2.2"/>
  <rect x="46" y="197" width="428" height="26" rx="13" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="260" y="215" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Intel 4004: função migra das trilhas para a memória</text>
  <line x1="260" y1="223" x2="260" y2="236" stroke="#1d4ed8" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

  <!-- ====================================================================== -->
  <!-- BLOCO INFERIOR: DEPOIS (ARQUITETURA PROGRAMAVEL MCS-4)                 -->
  <!-- ====================================================================== -->
  <rect x="12" y="240" width="496" height="190" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.6"/>
  <rect x="12" y="240" width="496" height="32" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="260" y="261" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#065f46">Depois: Arquitetura Programável MCS-4</text>

  <!-- Card 1 -->
  <rect x="24" y="284" width="144" height="80" rx="4" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.3"/>
  <text x="96" y="308" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#065f46">4 CIs padrão</text>
  <text x="96" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">4004, 4001,</text>
  <text x="96" y="347" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">4002 e 4003</text>

  <line x1="170" y1="324" x2="184" y2="324" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Card 2 -->
  <rect x="188" y="284" width="144" height="80" rx="4" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.3"/>
  <text x="260" y="308" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#065f46">Função definida</text>
  <text x="260" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#047857">em firmware</text>
  <text x="260" y="347" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">(ROM / EPROM)</text>

  <line x1="334" y1="324" x2="348" y2="324" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Card 3 -->
  <rect x="352" y="284" width="144" height="80" rx="4" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.3"/>
  <text x="424" y="308" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#065f46">Atualizações</text>
  <text x="424" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">por código</text>
  <text x="424" y="347" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#1e293b">em semanas</text>

  <!-- Faixa inferior de consequencias -->
  <rect x="24" y="376" width="472" height="42" rx="4" fill="#ecfdf5" stroke="#34d399" stroke-width="1.2"/>
  <text x="260" y="394" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#064e3b">Sistemas embarcados, robótica (ASEA IRB 6)</text>
  <text x="260" y="412" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#064e3b">e consolidação dos microcomputadores</text>
</svg>