<svg xmlns="http://www.w3.org/2000/svg" width="460" height="380" viewBox="0 0 460 380">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="460" height="380" fill="#ffffff"/>

  <!-- Quadro externo e barra de titulo -->
  <rect x="6" y="6" width="448" height="368" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="6" y="6" width="448" height="30" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="230" y="26" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">
    Porta metálica de alumínio sobre silício &#9001;111&#9002;
  </text>

  <!-- Caixa resumo superior esquerda -->
  <rect x="14" y="44" width="278" height="62" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="153" y="61" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    Alinhamento manual: folga L<tspan baseline-shift="sub" font-size="75%">ov</tspan> de 3 a 5 &#956;m
  </text>
  <text x="153" y="77" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    Fusão do Al (660 &#176;C): sem etapas &gt; 500 &#176;C
  </text>
  <text x="153" y="93" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    1 camada metálica, V<tspan baseline-shift="sub" font-size="75%">th</tspan> de &#8722;3,5 a &#8722;5,0 V
  </text>

  <!-- Substrato Si tipo n <111> -->
  <rect x="20" y="224" width="266" height="90" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="153" y="302" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1e3a8a">
    Substrato Si tipo n &#9001;111&#9002;
  </text>

  <!-- Fonte e Dreno p+ -->
  <rect x="26" y="224" width="68" height="46" fill="#ffedd5" stroke="#c2410c" stroke-width="1.3"/>
  <text x="60" y="244" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7c2d12">Fonte</text>
  <text x="60" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7c2d12">(p<tspan baseline-shift="super" font-size="75%">+</tspan>)</text>

  <rect x="212" y="224" width="68" height="46" fill="#ffedd5" stroke="#c2410c" stroke-width="1.3"/>
  <text x="246" y="244" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7c2d12">Dreno</text>
  <text x="246" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7c2d12">(p<tspan baseline-shift="super" font-size="75%">+</tspan>)</text>

  <!-- Oxido de campo e oxido fino de porta -->
  <rect x="20" y="206" width="16" height="18" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="52" y="206" width="14" height="18" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="240" y="206" width="14" height="18" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="270" y="206" width="16" height="18" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="66" y="210" width="174" height="14" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>

  <!-- Contatos metalicos S e D -->
  <rect x="36" y="184" width="16" height="40" fill="#cbd5e1" stroke="#475569" stroke-width="1.3"/>
  <line x1="44" y1="184" x2="44" y2="171" stroke="#334155" stroke-width="1.6"/>
  <text x="44" y="166" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">S</text>

  <rect x="254" y="184" width="16" height="40" fill="#cbd5e1" stroke="#475569" stroke-width="1.3"/>
  <line x1="262" y1="184" x2="262" y2="171" stroke="#334155" stroke-width="1.6"/>
  <text x="262" y="166" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">D</text>

  <!-- Porta de Aluminio -->
  <rect x="66" y="184" width="174" height="26" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
  <text x="153" y="201" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">
    Porta de Alumínio
  </text>

  <!-- Destaque C_gd na sobreposicao do dreno -->
  <rect x="212" y="209" width="28" height="16" fill="#3b82f6" fill-opacity="0.35" stroke="#1d4ed8" stroke-width="1.6" stroke-dasharray="3,2"/>

  <!-- Cotas L_ov esquerda e direita -->
  <line x1="66" y1="154" x2="66" y2="184" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="94" y1="154" x2="94" y2="224" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="68" y1="160" x2="92" y2="160" stroke="#334155" stroke-width="1.2" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
  <text x="80" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">
    L<tspan baseline-shift="sub" font-size="75%">ov</tspan>
  </text>

  <line x1="212" y1="154" x2="212" y2="224" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="240" y1="154" x2="240" y2="184" stroke="#64748b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="214" y1="160" x2="238" y2="160" stroke="#334155" stroke-width="1.2" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
  <text x="226" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">
    L<tspan baseline-shift="sub" font-size="75%">ov</tspan>
  </text>

  <!-- Chamada C_gd elevada com rota limpa por x=247 -->
  <rect x="108" y="116" width="90" height="24" rx="3" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="153" y="132" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1e40af">
    C<tspan baseline-shift="sub" font-size="75%">gd</tspan> elevada
  </text>
  <polyline points="198,128 247,128 247,217 242,217" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Alta densidade de cargas fixas (+) na interface SiO2/Si<111> -->
  <circle cx="114" cy="224" r="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="114" y="228" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#dc2626">+</text>
  <circle cx="130" cy="224" r="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="130" y="228" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#dc2626">+</text>
  <circle cx="146" cy="224" r="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="146" y="228" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#dc2626">+</text>
  <circle cx="162" cy="224" r="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="162" y="228" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#dc2626">+</text>
  <circle cx="178" cy="224" r="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="178" y="228" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#dc2626">+</text>
  <circle cx="194" cy="224" r="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="194" y="228" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#dc2626">+</text>

  <text x="153" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b91c1c">
    Alta carga
  </text>
  <text x="153" y="278" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b91c1c">
    fixa (+)
  </text>
  <line x1="138" y1="251" x2="130" y2="233" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>
  <line x1="168" y1="251" x2="178" y2="233" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrow-red)"/>

  <!-- Nota inferior esquerda -->
  <rect x="14" y="324" width="278" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="153" y="341" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    Cargas (+) em &#9001;111&#9002; repelem lacunas
  </text>
  <text x="153" y="356" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    e elevam |V<tspan baseline-shift="sub" font-size="75%">th</tspan>| da porta metálica
  </text>

  <!-- Mini-diagrama do inversor (Efeito Miller) -->
  <rect x="300" y="44" width="146" height="320" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="373" y="64" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">
    Inversor
  </text>
  <text x="373" y="79" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1e40af">
    (Efeito Miller)
  </text>

  <!-- Trilho V_SS no topo e transistor PMOS chave -->
  <text x="384" y="102" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">
    V<tspan baseline-shift="sub" font-size="75%">SS</tspan>
  </text>
  <line x1="366" y1="108" x2="402" y2="108" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="384" y1="108" x2="384" y2="122" stroke="#1e293b" stroke-width="1.6"/>

  <!-- Transistor PMOS com bolinha de porta -->
  <polyline points="384,122 370,122 370,158 384,158" fill="none" stroke="#1e293b" stroke-width="1.6"/>
  <line x1="364" y1="125" x2="364" y2="155" stroke="#1e293b" stroke-width="2"/>
  <circle cx="358" cy="140" r="2.8" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Entrada V_in -->
  <line x1="322" y1="140" x2="355" y2="140" stroke="#1e293b" stroke-width="1.6"/>
  <text x="319" y="129" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#dc2626">
    V<tspan baseline-shift="sub" font-size="75%">in</tspan>&#8593;
  </text>

  <!-- No V_out ao centro -->
  <line x1="384" y1="158" x2="384" y2="194" stroke="#1e293b" stroke-width="1.6"/>
  <circle cx="384" cy="176" r="3" fill="#1d4ed8"/>
  <line x1="384" y1="176" x2="407" y2="176" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="425" y="180" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1d4ed8">
    V<tspan baseline-shift="sub" font-size="75%">out</tspan>&#8595;
  </text>

  <!-- Capacitor Miller C_gd entre porta (V_in) e dreno (V_out) -->
  <circle cx="342" cy="140" r="2.8" fill="#1d4ed8"/>
  <line x1="342" y1="140" x2="342" y2="154" stroke="#1d4ed8" stroke-width="1.6"/>
  <line x1="331" y1="154" x2="353" y2="154" stroke="#1d4ed8" stroke-width="2.4"/>
  <line x1="331" y1="162" x2="353" y2="162" stroke="#1d4ed8" stroke-width="2.4"/>
  <polyline points="342,162 342,176 384,176" fill="none" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="317" y="162" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">
    C<tspan baseline-shift="sub" font-size="75%">gd</tspan>
  </text>

  <!-- Bloco Carga abaixo ligado ao trilho V_DD na base -->
  <rect x="362" y="194" width="44" height="30" rx="2" fill="#f1f5f9" stroke="#334155" stroke-width="1.4"/>
  <text x="384" y="213" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0f172a">Carga</text>
  <line x1="384" y1="224" x2="384" y2="246" stroke="#1e293b" stroke-width="1.6"/>
  <line x1="366" y1="246" x2="402" y2="246" stroke="#1e293b" stroke-width="1.8"/>
  <text x="384" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">
    V<tspan baseline-shift="sub" font-size="75%">DD</tspan>
  </text>

  <!-- Caixa formula Miller -->
  <rect x="307" y="282" width="132" height="72" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="373" y="302" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1e3a8a">
    C<tspan baseline-shift="sub" font-size="75%">in,M</tspan> = C<tspan baseline-shift="sub" font-size="75%">gd</tspan>(1+|A<tspan baseline-shift="sub" font-size="75%">v</tspan>|)
  </text>
  <text x="373" y="323" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    Saída oposta amplia
  </text>
  <text x="373" y="339" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    carga na entrada
  </text>
</svg>
