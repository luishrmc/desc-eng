<svg xmlns="http://www.w3.org/2000/svg" width="460" height="350" viewBox="0 0 460 350">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="460" height="350" fill="#ffffff"/>

  <rect x="4" y="4" width="452" height="342" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="4" y="4" width="452" height="30" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="230" y="24" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Formas de onda V<tspan baseline-shift="sub" font-size="75%">out</tspan>(t) e V<tspan baseline-shift="sub" font-size="75%">G</tspan>(t)</text>

  <!-- Area do grafico -->
  <rect x="68" y="64" width="366" height="194" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <!-- Faixa de pre-carga -->
  <rect x="68" y="64" width="102" height="194" fill="#fefce8"/>
  <text x="119" y="54" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#854d0e">Pré-carga</text>
  <text x="302" y="54" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Descarga (M<tspan baseline-shift="sub" font-size="75%">iso</tspan> cortado)</text>

  <!-- Divisor vertical das fases -->
  <line x1="170" y1="64" x2="170" y2="258" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3"/>

  <!-- Linhas horizontais de referencia de tensao (+5, 0, -8, -10, -18 V) -->
  <line x1="68" y1="78" x2="434" y2="78" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="62" y="82" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#0f172a">+5 V</text>

  <line x1="68" y1="113" x2="434" y2="113" stroke="#e2e8f0" stroke-width="1"/>
  <text x="62" y="117" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#475569">0 V</text>

  <line x1="68" y1="169" x2="434" y2="169" stroke="#fca5a5" stroke-width="1.1" stroke-dasharray="3,3"/>
  <text x="62" y="171" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#b91c1c">&#8722;8 V</text>

  <line x1="68" y1="185" x2="434" y2="185" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="62" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#1d4ed8">&#8722;10 V</text>

  <line x1="68" y1="241" x2="434" y2="241" stroke="#ddd6fe" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="62" y="245" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#6d28d9">&#8722;18 V</text>

  <!-- Eixos principais -->
  <line x1="68" y1="64" x2="68" y2="258" stroke="#334155" stroke-width="1.5"/>
  <line x1="68" y1="258" x2="438" y2="258" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="444" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">t</text>

  <!-- Curva 1: V_out(t) sem bootstrapping (estanca em -8 V) -->
  <path d="M 68 78 L 170 78 C 202 112, 254 165, 428 169" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="366" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b91c1c">V<tspan baseline-shift="sub" font-size="75%">DD</tspan>+|V<tspan baseline-shift="sub" font-size="75%">th</tspan>|</text>

  <!-- Curva 2: V_out(t) com bootstrapping (atinge -10 V = V_DD) -->
  <path d="M 68 78 L 170 78 C 198 121, 248 182, 428 185" fill="none" stroke="#2563eb" stroke-width="2.8"/>
  <text x="374" y="203" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">V<tspan baseline-shift="sub" font-size="75%">out</tspan>=V<tspan baseline-shift="sub" font-size="75%">DD</tspan></text>

  <!-- Curva 3: V_G(t) no no flutuante N_G -->
  <path d="M 68 128 C 98 154, 130 167, 170 169 C 198 198, 252 237, 428 241" fill="none" stroke="#7c3aed" stroke-width="2.6"/>

  <!-- Seta vertical mostrando |V_GS| > |V_th| -->
  <line x1="274" y1="187" x2="274" y2="239" stroke="#7c3aed" stroke-width="1.4" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)"/>
  <text x="282" y="218" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#6d28d9">|V<tspan baseline-shift="sub" font-size="75%">GS</tspan>|&gt;|V<tspan baseline-shift="sub" font-size="75%">th</tspan>|</text>

  <!-- Anotacao pre-carga -->
  <text x="119" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6d28d9">V<tspan baseline-shift="sub" font-size="75%">G,inicial</tspan></text>

  <!-- Legenda inferior -->
  <rect x="20" y="270" width="420" height="68" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <line x1="34" y1="288" x2="66" y2="288" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="74" y="292" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">out</tspan>(t) sem bootstrapping (perde |V<tspan baseline-shift="sub" font-size="75%">th</tspan>|)</text>

  <line x1="34" y1="308" x2="66" y2="308" stroke="#2563eb" stroke-width="2.8"/>
  <text x="74" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">out</tspan>(t) com bootstrapping (atinge V<tspan baseline-shift="sub" font-size="75%">DD</tspan>)</text>

  <line x1="34" y1="328" x2="66" y2="328" stroke="#7c3aed" stroke-width="2.6"/>
  <text x="74" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">G</tspan>(t) em N<tspan baseline-shift="sub" font-size="75%">G</tspan>: V<tspan baseline-shift="sub" font-size="75%">G,inicial</tspan> + &#916;V<tspan baseline-shift="sub" font-size="75%">out</tspan></text>
</svg>
