<svg xmlns="http://www.w3.org/2000/svg" width="920" height="370" viewBox="0 0 920 370">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="370" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- PAINEL (a): TOPOLOGIAS DE CARGA PMOS                                   -->
  <!-- ====================================================================== -->
  <rect x="12" y="10" width="490" height="350" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="12" y="10" width="490" height="32" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="257" y="31" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">(a) Topologias de carga PMOS (V<tspan baseline-shift="sub" font-size="75%">SS</tspan> = +5 V a V<tspan baseline-shift="sub" font-size="75%">DD</tspan> = &#8722;10 V)</text>

  <!-- SUBPAINEL ESQUERDO: CARGA CONVENCIONAL -->
  <rect x="24" y="50" width="196" height="298" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="122" y="69" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Carga PMOS convencional</text>

  <!-- Trilho V_SS = +5 V -->
  <line x1="90" y1="88" x2="154" y2="88" stroke="#1e293b" stroke-width="2"/>
  <text x="122" y="83" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">SS</tspan> (+5 V)</text>
  <line x1="122" y1="88" x2="122" y2="104" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Transistor M_in -->
  <polyline points="122,104 108,104 108,136 122,136" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="102" y1="106" x2="102" y2="134" stroke="#1e293b" stroke-width="2.2"/>
  <circle cx="96" cy="120" r="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="66" y1="120" x2="93" y2="120" stroke="#1e293b" stroke-width="1.8"/>
  <text x="50" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">V<tspan baseline-shift="sub" font-size="75%">in</tspan></text>
  <text x="134" y="124" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">M<tspan baseline-shift="sub" font-size="75%">in</tspan></text>

  <!-- No V_out -->
  <line x1="122" y1="136" x2="122" y2="178" stroke="#1e293b" stroke-width="1.8"/>
  <circle cx="122" cy="157" r="3.5" fill="#dc2626"/>
  <line x1="122" y1="157" x2="172" y2="157" stroke="#dc2626" stroke-width="1.8"/>
  <text x="192" y="161" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b91c1c">V<tspan baseline-shift="sub" font-size="75%">out</tspan></text>

  <!-- Transistor M_load convencional -->
  <polyline points="122,178 108,178 108,214 122,214" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="102" y1="180" x2="102" y2="212" stroke="#1e293b" stroke-width="2.2"/>
  <circle cx="96" cy="196" r="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="130" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#475569">S</text>
  <text x="130" y="218" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#475569">D</text>
  <text x="138" y="200" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">M<tspan baseline-shift="sub" font-size="75%">load</tspan></text>

  <!-- Porta ligada fixa em V_DD -->
  <line x1="93" y1="196" x2="66" y2="196" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="66" y1="196" x2="66" y2="238" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="66" y1="238" x2="154" y2="238" stroke="#1e293b" stroke-width="2"/>
  <line x1="122" y1="214" x2="122" y2="238" stroke="#1e293b" stroke-width="1.8"/>
  <circle cx="122" cy="238" r="3" fill="#1e293b"/>
  <text x="122" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">DD</tspan> (&#8722;10 V)</text>

  <!-- Resultado convencional -->
  <rect x="33" y="268" width="178" height="70" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="122" y="287" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Porta fixa em V<tspan baseline-shift="sub" font-size="75%">DD</tspan></text>
  <text x="122" y="306" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#7f1d1d">Corta em V<tspan baseline-shift="sub" font-size="75%">out</tspan>=V<tspan baseline-shift="sub" font-size="75%">DD</tspan>+|V<tspan baseline-shift="sub" font-size="75%">th</tspan>|</text>
  <text x="122" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#991b1b">(estanca perto de &#8722;8 V)</text>

  <!-- SUBPAINEL DIREITO: CARGA COM BOOTSTRAPPING DINAMICO -->
  <rect x="230" y="50" width="260" height="298" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
  <text x="360" y="69" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Carga com bootstrapping dinâmico</text>

  <!-- Trilho V_SS = +5 V -->
  <line x1="364" y1="88" x2="432" y2="88" stroke="#1e293b" stroke-width="2"/>
  <text x="398" y="83" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">SS</tspan> (+5 V)</text>
  <line x1="398" y1="88" x2="398" y2="104" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Transistor M_in -->
  <polyline points="398,104 384,104 384,134 398,134" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="378" y1="106" x2="378" y2="132" stroke="#1e293b" stroke-width="2.2"/>
  <circle cx="372" cy="119" r="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="346" y1="119" x2="369" y2="119" stroke="#1e293b" stroke-width="1.8"/>
  <text x="334" y="123" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">V<tspan baseline-shift="sub" font-size="75%">in</tspan></text>
  <text x="410" y="123" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">M<tspan baseline-shift="sub" font-size="75%">in</tspan></text>

  <!-- No V_out + ligacao para C_B -->
  <line x1="398" y1="134" x2="398" y2="180" stroke="#1e293b" stroke-width="1.8"/>
  <circle cx="398" cy="152" r="3.5" fill="#2563eb"/>
  <line x1="398" y1="152" x2="444" y2="152" stroke="#2563eb" stroke-width="1.8"/>
  <text x="466" y="156" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">V<tspan baseline-shift="sub" font-size="75%">out</tspan></text>

  <!-- Transistor M_load com porta no no flutuante N_G -->
  <polyline points="398,180 384,180 384,216 398,216" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="378" y1="182" x2="378" y2="214" stroke="#1e293b" stroke-width="2.2"/>
  <circle cx="372" cy="198" r="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="406" y="184" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#475569">S</text>
  <text x="406" y="220" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#475569">D</text>
  <text x="415" y="202" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">M<tspan baseline-shift="sub" font-size="75%">load</tspan></text>

  <!-- Trilho V_DD = -10 V em M_load -->
  <line x1="398" y1="216" x2="398" y2="238" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="364" y1="238" x2="432" y2="238" stroke="#1e293b" stroke-width="2"/>
  <text x="398" y="254" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">DD</tspan> (&#8722;10 V)</text>

  <!-- No flutuante N_G (x=326, y=198) -->
  <line x1="326" y1="198" x2="369" y2="198" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="326" cy="198" r="4" fill="#7c3aed"/>
  <text x="350" y="213" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6d28d9">N<tspan baseline-shift="sub" font-size="75%">G</tspan></text>

  <!-- Capacitor C_B entre V_out (y=152) e N_G (y=198) -->
  <line x1="398" y1="152" x2="326" y2="152" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="326" y1="152" x2="326" y2="170" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="312" y1="170" x2="340" y2="170" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="312" y1="179" x2="340" y2="179" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="326" y1="179" x2="326" y2="198" stroke="#2563eb" stroke-width="1.8"/>
  <text x="354" y="179" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">C<tspan baseline-shift="sub" font-size="75%">B</tspan></text>

  <!-- Capacitancia parasita C_P (C_B >> C_P) -->
  <line x1="326" y1="198" x2="326" y2="220" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="316" y1="220" x2="336" y2="220" stroke="#64748b" stroke-width="2"/>
  <line x1="316" y1="227" x2="336" y2="227" stroke="#64748b" stroke-width="2"/>
  <line x1="326" y1="227" x2="326" y2="242" stroke="#64748b" stroke-width="1.5"/>
  <line x1="316" y1="242" x2="336" y2="242" stroke="#64748b" stroke-width="1.8"/>
  <line x1="320" y1="246" x2="332" y2="246" stroke="#64748b" stroke-width="1.4"/>
  <text x="292" y="232" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">C<tspan baseline-shift="sub" font-size="75%">P</tspan></text>
  <text x="282" y="248" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#64748b">(C<tspan baseline-shift="sub" font-size="75%">B</tspan>&#8811;C<tspan baseline-shift="sub" font-size="75%">P</tspan>)</text>

  <!-- Transistor de isolamento/amostragem M_iso -->
  <polyline points="264,198 264,185 296,185 296,198" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="266" y1="179" x2="294" y2="179" stroke="#1e293b" stroke-width="2.2"/>
  <circle cx="280" cy="173" r="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="280" y1="156" x2="280" y2="170" stroke="#1e293b" stroke-width="1.6"/>
  <text x="280" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#334155">Pré-carga</text>
  <text x="280" y="213" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">M<tspan baseline-shift="sub" font-size="75%">iso</tspan></text>
  <line x1="296" y1="198" x2="326" y2="198" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="246" y1="198" x2="264" y2="198" stroke="#1e293b" stroke-width="1.8"/>
  <text x="252" y="191" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">DD</tspan></text>

  <!-- Resultado com bootstrapping -->
  <rect x="240" y="268" width="240" height="70" rx="4" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.2"/>
  <text x="360" y="287" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">C<tspan baseline-shift="sub" font-size="75%">B</tspan> acopla &#916;V<tspan baseline-shift="sub" font-size="75%">out</tspan> ao nó N<tspan baseline-shift="sub" font-size="75%">G</tspan></text>
  <text x="360" y="306" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#065f46">|V<tspan baseline-shift="sub" font-size="75%">G</tspan>(t)| &gt; |V<tspan baseline-shift="sub" font-size="75%">DD</tspan>| (abaixo de &#8722;10 V)</text>
  <text x="360" y="325" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#047857">Excursão plena: V<tspan baseline-shift="sub" font-size="75%">out</tspan> = V<tspan baseline-shift="sub" font-size="75%">DD</tspan> (&#8722;10 V)</text>

  <!-- ====================================================================== -->
  <!-- PAINEL (b): FORMAS DE ONDA V_out(t) e V_G(t)                           -->
  <!-- ====================================================================== -->
  <rect x="514" y="10" width="394" height="350" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="514" y="10" width="394" height="32" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="711" y="31" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">(b) Formas de onda V<tspan baseline-shift="sub" font-size="75%">out</tspan>(t) e V<tspan baseline-shift="sub" font-size="75%">G</tspan>(t)</text>

  <!-- Area do grafico -->
  <rect x="582" y="68" width="310" height="196" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <!-- Faixa de pre-carga -->
  <rect x="582" y="68" width="90" height="196" fill="#fefce8"/>
  <text x="627" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#854d0e">Pré-carga</text>
  <text x="782" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Descarga (M<tspan baseline-shift="sub" font-size="75%">iso</tspan> cortado)</text>

  <!-- Divisor vertical das fases -->
  <line x1="672" y1="68" x2="672" y2="264" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3"/>

  <!-- Linhas horizontais de referencia de tensao (+5, 0, -8, -10, -18 V) -->
  <!-- +5 V (y=82) -->
  <line x1="582" y1="82" x2="892" y2="82" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="576" y="86" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#0f172a">+5 V</text>

  <!-- 0 V (y=117) -->
  <line x1="582" y1="117" x2="892" y2="117" stroke="#e2e8f0" stroke-width="1"/>
  <text x="576" y="121" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#475569">0 V</text>

  <!-- -8 V (y=173) -->
  <line x1="582" y1="173" x2="892" y2="173" stroke="#fca5a5" stroke-width="1.1" stroke-dasharray="3,3"/>
  <text x="576" y="175" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#b91c1c">&#8722;8 V</text>

  <!-- -10 V (y=189) -->
  <line x1="582" y1="189" x2="892" y2="189" stroke="#93c5fd" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="576" y="194" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#1d4ed8">&#8722;10 V</text>

  <!-- -18 V (y=245) -->
  <line x1="582" y1="245" x2="892" y2="245" stroke="#ddd6fe" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="576" y="249" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="end" fill="#6d28d9">&#8722;18 V</text>

  <!-- Eixos principais -->
  <line x1="582" y1="68" x2="582" y2="264" stroke="#334155" stroke-width="1.5"/>
  <line x1="582" y1="264" x2="894" y2="264" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="896" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">t</text>

  <!-- Curva 1: V_out(t) sem bootstrapping (estanca em -8 V) -->
  <path d="M 582 82 L 672 82 C 698 116, 742 169, 886 173" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="822" y="154" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#b91c1c">V<tspan baseline-shift="sub" font-size="75%">DD</tspan>+|V<tspan baseline-shift="sub" font-size="75%">th</tspan>|</text>

  <!-- Curva 2: V_out(t) com bootstrapping (atinge -10 V = V_DD) -->
  <path d="M 582 82 L 672 82 C 696 125, 738 186, 886 189" fill="none" stroke="#2563eb" stroke-width="2.8"/>
  <text x="832" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">V<tspan baseline-shift="sub" font-size="75%">out</tspan>=V<tspan baseline-shift="sub" font-size="75%">DD</tspan></text>

  <!-- Curva 3: V_G(t) no no flutuante N_G (pre-carga a -8 V, desce alem de V_DD ate ~-18 V) -->
  <path d="M 582 132 C 608 158, 636 171, 672 173 C 696 202, 740 241, 886 245" fill="none" stroke="#7c3aed" stroke-width="2.6"/>

  <!-- Seta vertical mostrando |V_GS| > |V_th| entre V_out (-10 V) e V_G (-18 V) -->
  <line x1="762" y1="191" x2="762" y2="243" stroke="#7c3aed" stroke-width="1.4" marker-start="url(#arrow-purple)" marker-end="url(#arrow-purple)"/>
  <text x="770" y="222" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#6d28d9">|V<tspan baseline-shift="sub" font-size="75%">GS</tspan>|&gt;|V<tspan baseline-shift="sub" font-size="75%">th</tspan>|</text>

  <!-- Anotacoes nos eixos de fase -->
  <text x="627" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#6d28d9">V<tspan baseline-shift="sub" font-size="75%">G,inicial</tspan></text>

  <!-- Legenda inferior do Painel (b) -->
  <rect x="528" y="278" width="366" height="72" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <line x1="540" y1="297" x2="570" y2="297" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="578" y="301" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">out</tspan>(t) sem boot (perde |V<tspan baseline-shift="sub" font-size="75%">th</tspan>|)</text>

  <line x1="540" y1="318" x2="570" y2="318" stroke="#2563eb" stroke-width="2.8"/>
  <text x="578" y="322" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">out</tspan>(t) com boot (atinge V<tspan baseline-shift="sub" font-size="75%">DD</tspan>)</text>

  <line x1="540" y1="338" x2="570" y2="338" stroke="#7c3aed" stroke-width="2.6"/>
  <text x="578" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">G</tspan>(t) em N<tspan baseline-shift="sub" font-size="75%">G</tspan>: V<tspan baseline-shift="sub" font-size="75%">G,inicial</tspan> + &#916;V<tspan baseline-shift="sub" font-size="75%">out</tspan></text>
</svg>
