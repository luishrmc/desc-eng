<svg xmlns="http://www.w3.org/2000/svg" width="460" height="340" viewBox="0 0 460 340">
  <rect x="0" y="0" width="460" height="340" fill="#ffffff"/>

  <!-- Moldura e cabecalho -->
  <rect x="6" y="6" width="448" height="328" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.4"/>
  <rect x="6" y="6" width="448" height="28" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.4"/>
  <text x="230" y="25" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Desempenho em litografia de 10 &#956;m</text>

  <!-- Legenda superior -->
  <rect x="44" y="44" width="12" height="12" rx="2" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.2"/>
  <rect x="44" y="44" width="7" height="12" rx="1" fill="#ef4444"/>
  <text x="62" y="54" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b">Porta de Alumínio</text>

  <rect x="218" y="44" width="12" height="12" rx="2" fill="#5eead4" stroke="#0f766e" stroke-width="1.2"/>
  <rect x="218" y="44" width="7" height="12" rx="1" fill="#0d9488"/>
  <text x="236" y="54" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#115e59">PMOS SGT (Intel 4004)</text>

  <!-- Linhas de grade verticais (0% em x=116, 50% em x=186, 100% em x=256; max=140px) -->
  <line x1="186" y1="68" x2="186" y2="306" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="256" y1="68" x2="256" y2="306" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Metrica 1: Sobreposicao L_ov (3,5 a 6,0 um vs 0,5 a 1,0 um; ref 6,0 = 140 px) -->
  <text x="108" y="84" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="end" fill="#0f172a">Sobreposição</text>
  <text x="108" y="99" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="end" fill="#334155">L<tspan baseline-shift="sub" font-size="75%">ov</tspan></text>

  <rect x="116" y="71" width="140" height="14" rx="2" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.1"/>
  <rect x="116" y="71" width="82" height="14" rx="1" fill="#ef4444"/>
  <text x="264" y="82" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#7f1d1d">3,5 a 6,0 &#956;m</text>

  <rect x="116" y="89" width="23" height="14" rx="2" fill="#5eead4" stroke="#0f766e" stroke-width="1.1"/>
  <rect x="116" y="89" width="12" height="14" rx="1" fill="#0d9488"/>
  <text x="147" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#115e59">0,5 a 1,0 &#956;m</text>

  <line x1="16" y1="112" x2="444" y2="112" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Metrica 2: Capacitancia C_ov (1,2 a 2,1 fF/um vs 0,17 a 0,35 fF/um; ref 2,1 = 140 px) -->
  <text x="108" y="131" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="end" fill="#0f172a">Capacitância</text>
  <text x="108" y="146" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="end" fill="#334155">C<tspan baseline-shift="sub" font-size="75%">ov</tspan></text>

  <rect x="116" y="118" width="140" height="14" rx="2" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.1"/>
  <rect x="116" y="118" width="80" height="14" rx="1" fill="#ef4444"/>
  <text x="264" y="129" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#7f1d1d">1,2 a 2,1 fF/&#956;m</text>

  <rect x="116" y="136" width="23" height="14" rx="2" fill="#5eead4" stroke="#0f766e" stroke-width="1.1"/>
  <rect x="116" y="136" width="11" height="14" rx="1" fill="#0d9488"/>
  <text x="147" y="147" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#115e59">0,17 a 0,35 fF/&#956;m</text>

  <line x1="16" y1="159" x2="444" y2="159" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Metrica 3: Modulo |V_th| (3,5 a 5,0 V vs 1,5 a 2,5 V; ref 5,0 = 140 px) -->
  <text x="108" y="178" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="end" fill="#0f172a">Módulo</text>
  <text x="108" y="193" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="end" fill="#334155">|V<tspan baseline-shift="sub" font-size="75%">th</tspan>|</text>

  <rect x="116" y="165" width="140" height="14" rx="2" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.1"/>
  <rect x="116" y="165" width="98" height="14" rx="1" fill="#ef4444"/>
  <text x="264" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#7f1d1d">3,5 a 5,0 V</text>

  <rect x="116" y="183" width="70" height="14" rx="2" fill="#5eead4" stroke="#0f766e" stroke-width="1.1"/>
  <rect x="116" y="183" width="42" height="14" rx="1" fill="#0d9488"/>
  <text x="194" y="194" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#115e59">1,5 a 2,5 V</text>

  <line x1="16" y1="206" x2="444" y2="206" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Metrica 4: Frequencia f_max (< 150 kHz vs 740 a 750 kHz; ref 750 = 140 px) -->
  <text x="108" y="225" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="end" fill="#0f172a">Frequência</text>
  <text x="108" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="end" fill="#334155">f<tspan baseline-shift="sub" font-size="75%">max</tspan></text>

  <rect x="116" y="212" width="28" height="14" rx="2" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.1"/>
  <text x="152" y="223" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#7f1d1d">&lt; 150 kHz</text>

  <rect x="116" y="230" width="140" height="14" rx="2" fill="#5eead4" stroke="#0f766e" stroke-width="1.1"/>
  <rect x="116" y="230" width="138" height="14" rx="1" fill="#0d9488"/>
  <text x="264" y="241" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#115e59">740 a 750 kHz (~5&#215;)</text>

  <line x1="16" y1="253" x2="444" y2="253" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Metrica 5: Densidade (90 a 100 vs 192 trans./mm2; ref 192 = 140 px) -->
  <text x="108" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="end" fill="#0f172a">Densidade</text>
  <text x="108" y="287" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="end" fill="#334155">(trans./mm&#178;)</text>

  <rect x="116" y="259" width="73" height="14" rx="2" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.1"/>
  <rect x="116" y="259" width="66" height="14" rx="1" fill="#ef4444"/>
  <text x="197" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#7f1d1d">90 a 100 trans./mm&#178;</text>

  <rect x="116" y="277" width="140" height="14" rx="2" fill="#0d9488" stroke="#0f766e" stroke-width="1.1"/>
  <text x="264" y="287" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#115e59">192 trans./mm&#178;</text>
  <text x="264" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" fill="#0f766e">(2.300 em 12 mm&#178;)</text>

  <!-- Eixo base e ticks -->
  <line x1="116" y1="68" x2="116" y2="306" stroke="#334155" stroke-width="1.4"/>
  <line x1="116" y1="306" x2="262" y2="306" stroke="#334155" stroke-width="1.2"/>
  <text x="116" y="322" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">0%</text>
  <text x="186" y="322" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">50%</text>
  <text x="256" y="322" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">100%</text>
  <text x="444" y="322" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="end" fill="#475569">Escuro: mín. | Claro: máx.</text>
</svg>
