<svg xmlns="http://www.w3.org/2000/svg" width="920" height="395" viewBox="0 0 920 395">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="395" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- PAINEL (a): GRAFICO COMPARATIVO QUANTITATIVO EM LITOGRAFIA DE 10 um    -->
  <!-- ====================================================================== -->
  <rect x="12" y="10" width="484" height="375" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="12" y="10" width="484" height="30" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="254" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">(a) Desempenho comparativo em litografia de 10 &#956;m</text>

  <!-- Legenda superior -->
  <rect x="66" y="52" width="12" height="12" rx="2" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.2"/>
  <rect x="66" y="52" width="7" height="12" rx="1" fill="#ef4444"/>
  <text x="84" y="62" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#991b1b">Porta de Alumínio</text>

  <rect x="244" y="52" width="12" height="12" rx="2" fill="#5eead4" stroke="#0f766e" stroke-width="1.2"/>
  <rect x="244" y="52" width="7" height="12" rx="1" fill="#0d9488"/>
  <text x="262" y="62" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#115e59">PMOS SGT (Intel 4004)</text>

  <!-- Linhas de grade verticais (0%, 50%, 100% para x_0=134, max=140 px -> x_100=274) -->
  <line x1="204" y1="76" x2="204" y2="354" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="274" y1="76" x2="274" y2="354" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Metrica 1: Sobreposicao L_ov (3,5 a 6,0 um vs 0,5 a 1,0 um; ref 6,0 = 140 px) -->
  <text x="126" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="end" fill="#0f172a">Sobreposição</text>
  <text x="126" y="112" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="end" fill="#334155">L<tspan baseline-shift="sub" font-size="75%">ov</tspan></text>

  <rect x="134" y="81" width="140" height="16" rx="2" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.1"/>
  <rect x="134" y="81" width="82" height="16" rx="1" fill="#ef4444"/>
  <text x="282" y="93" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#7f1d1d">3,5 a 6,0 &#956;m</text>

  <rect x="134" y="101" width="23" height="16" rx="2" fill="#5eead4" stroke="#0f766e" stroke-width="1.1"/>
  <rect x="134" y="101" width="12" height="16" rx="1" fill="#0d9488"/>
  <text x="165" y="113" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#115e59">0,5 a 1,0 &#956;m</text>

  <line x1="24" y1="127" x2="484" y2="127" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Metrica 2: Capacitancia C_ov (1,2 a 2,1 fF/um vs 0,17 a 0,35 fF/um; ref 2,1 = 140 px) -->
  <text x="126" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="end" fill="#0f172a">Capacitância</text>
  <text x="126" y="166" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="end" fill="#334155">C<tspan baseline-shift="sub" font-size="75%">ov</tspan></text>

  <rect x="134" y="135" width="140" height="16" rx="2" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.1"/>
  <rect x="134" y="135" width="80" height="16" rx="1" fill="#ef4444"/>
  <text x="282" y="147" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#7f1d1d">1,2 a 2,1 fF/&#956;m</text>

  <rect x="134" y="155" width="23" height="16" rx="2" fill="#5eead4" stroke="#0f766e" stroke-width="1.1"/>
  <rect x="134" y="155" width="11" height="16" rx="1" fill="#0d9488"/>
  <text x="165" y="167" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#115e59">0,17 a 0,35 fF/&#956;m</text>

  <line x1="24" y1="181" x2="484" y2="181" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Metrica 3: Modulo |V_th| (3,5 a 5,0 V vs 1,5 a 2,5 V; ref 5,0 = 140 px) -->
  <text x="126" y="204" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="end" fill="#0f172a">Módulo</text>
  <text x="126" y="220" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="end" fill="#334155">|V<tspan baseline-shift="sub" font-size="75%">th</tspan>|</text>

  <rect x="134" y="189" width="140" height="16" rx="2" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.1"/>
  <rect x="134" y="189" width="98" height="16" rx="1" fill="#ef4444"/>
  <text x="282" y="201" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#7f1d1d">3,5 a 5,0 V</text>

  <rect x="134" y="209" width="70" height="16" rx="2" fill="#5eead4" stroke="#0f766e" stroke-width="1.1"/>
  <rect x="134" y="209" width="42" height="16" rx="1" fill="#0d9488"/>
  <text x="212" y="221" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#115e59">1,5 a 2,5 V</text>

  <line x1="24" y1="235" x2="484" y2="235" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Metrica 4: Frequencia f_max (< 150 kHz vs 740 a 750 kHz; ref 750 = 140 px) -->
  <text x="126" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="end" fill="#0f172a">Frequência</text>
  <text x="126" y="274" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="end" fill="#334155">f<tspan baseline-shift="sub" font-size="75%">max</tspan></text>

  <rect x="134" y="243" width="28" height="16" rx="2" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.1"/>
  <text x="170" y="255" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#7f1d1d">&lt; 150 kHz</text>

  <rect x="134" y="263" width="140" height="16" rx="2" fill="#5eead4" stroke="#0f766e" stroke-width="1.1"/>
  <rect x="134" y="263" width="138" height="16" rx="1" fill="#0d9488"/>
  <text x="282" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#115e59">740 a 750 kHz (~5&#215;)</text>

  <line x1="24" y1="289" x2="484" y2="289" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Metrica 5: Densidade (90 a 100 vs 192 trans./mm2; ref 192 = 140 px) -->
  <text x="126" y="312" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="end" fill="#0f172a">Densidade</text>
  <text x="126" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="end" fill="#334155">(trans./mm&#178;)</text>

  <rect x="134" y="297" width="73" height="16" rx="2" fill="#fca5a5" stroke="#b91c1c" stroke-width="1.1"/>
  <rect x="134" y="297" width="66" height="16" rx="1" fill="#ef4444"/>
  <text x="215" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#7f1d1d">90 a 100 trans./mm&#178;</text>

  <rect x="134" y="317" width="140" height="16" rx="2" fill="#0d9488" stroke="#0f766e" stroke-width="1.1"/>
  <text x="282" y="328" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" fill="#115e59">192 trans./mm&#178;</text>
  <text x="282" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" fill="#0f766e">(2.300 em 12 mm&#178;)</text>

  <!-- Eixo base e ticks -->
  <line x1="134" y1="76" x2="134" y2="354" stroke="#334155" stroke-width="1.5"/>
  <line x1="134" y1="354" x2="280" y2="354" stroke="#334155" stroke-width="1.3"/>
  <text x="134" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">0%</text>
  <text x="204" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">50%</text>
  <text x="274" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">100%</text>
  <text x="484" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="10" text-anchor="end" fill="#475569">Sólido: mín. | Claro: máx.</text>

  <!-- ====================================================================== -->
  <!-- PAINEL (b): LINHAGEM EVOLUTIVA DE FAGGIN (1971 a 1976) + MOS 6502      -->
  <!-- ====================================================================== -->
  <rect x="508" y="10" width="400" height="375" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="508" y="10" width="400" height="30" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="708" y="30" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">(b) Linhagem de processadores (1971 a 1976)</text>

  <!-- No 1: Intel 4004 -->
  <rect x="522" y="52" width="220" height="60" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="632" y="70" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Intel 4004 (1971)</text>
  <text x="632" y="86" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">PMOS 10 &#956;m | 4 bits</text>
  <text x="632" y="102" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">2.300 trans. | 740 kHz</text>

  <line x1="632" y1="112" x2="632" y2="128" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- No 2: Intel 8008 -->
  <rect x="522" y="132" width="220" height="60" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="632" y="150" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Intel 8008 (1972)</text>
  <text x="632" y="166" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">PMOS 10 &#956;m | 8 bits</text>
  <text x="632" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">3.500 trans. | 16 KB</text>

  <line x1="632" y1="192" x2="632" y2="208" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- No 3: Intel 8080 -->
  <rect x="522" y="212" width="220" height="60" rx="4" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text x="632" y="230" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Intel 8080 (1974)</text>
  <text x="632" y="246" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">NMOS 6 &#956;m | 8 bits</text>
  <text x="632" y="262" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#047857">2 MHz | 64 KB</text>

  <line x1="632" y1="272" x2="632" y2="288" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arrow-teal)"/>

  <!-- No 4: Zilog Z80 -->
  <rect x="522" y="292" width="220" height="60" rx="4" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.6"/>
  <text x="632" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#134e4a">Zilog Z80 (1976)</text>
  <text x="632" y="326" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">NMOS | +5 V unipolar</text>
  <text x="632" y="342" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0f766e">Refresh DRAM integrado</text>

  <text x="632" y="370" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#334155">Linhagem SGT conduzida por Faggin</text>

  <!-- Caixa lateral discreta: MOS 6502 (1975) -->
  <rect x="756" y="182" width="138" height="134" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,3"/>
  <rect x="756" y="182" width="138" height="24" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.3"/>
  <text x="825" y="198" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#334155">Ramo independente</text>
  <text x="825" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">MOS 6502 (1975)</text>
  <text x="825" y="244" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">Derivado do</text>
  <text x="825" y="259" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">Motorola 6800</text>
  <text x="825" y="275" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">(Chuck Peddle)</text>
  <text x="825" y="295" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">Sem vínculo com</text>
  <text x="825" y="309" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">a linhagem SGT</text>
</svg>