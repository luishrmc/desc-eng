<svg xmlns="http://www.w3.org/2000/svg" width="460" height="380" viewBox="0 0 460 380">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="460" height="380" fill="#ffffff"/>

  <!-- Quadro externo e barra de titulo -->
  <rect x="6" y="6" width="448" height="368" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="6" y="6" width="448" height="30" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="230" y="26" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">
    Porta autoalinhada de polissilício, SGT (Si &#9001;100&#9002;)
  </text>

  <!-- Caixa resumo superior esquerda -->
  <rect x="14" y="44" width="278" height="62" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="153" y="61" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    Polissilício antes da difusão (&gt; 1100 &#176;C)
  </text>
  <text x="153" y="77" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    Recozimento em alta T e captura iônica
  </text>
  <text x="153" y="93" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    Óxido contínuo isola 2&#170; camada de Al
  </text>

  <!-- Substrato Si tipo n <100> -->
  <rect x="20" y="212" width="266" height="102" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="153" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1e3a8a">
    Substrato Si tipo n &#9001;100&#9002;
  </text>

  <!-- Fonte e Dreno p+ autoalinhados (pequena difusao lateral de 7 px sob o poli) -->
  <rect x="26" y="212" width="77" height="46" fill="#ffedd5" stroke="#c2410c" stroke-width="1.3"/>
  <text x="64" y="232" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7c2d12">Fonte</text>
  <text x="64" y="247" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7c2d12">(p<tspan baseline-shift="super" font-size="75%">+</tspan>)</text>

  <rect x="203" y="212" width="77" height="46" fill="#ffedd5" stroke="#c2410c" stroke-width="1.3"/>
  <text x="242" y="232" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7c2d12">Dreno</text>
  <text x="242" y="247" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7c2d12">(p<tspan baseline-shift="super" font-size="75%">+</tspan>)</text>

  <!-- Oxido isolante continuo envolvendo o polissilicio e descendo ao substrato -->
  <polygon points="20,212 20,202 74,202 74,146 232,146 232,202 286,202 286,212 210,212 210,172 96,172 96,212" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
  <text x="153" y="163" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#0e7490">
    Óxido isolante
  </text>

  <!-- Oxido fino de porta -->
  <rect x="96" y="200" width="114" height="12" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>

  <!-- Porta de polissilicio p+ (mascara termica) -->
  <rect x="96" y="172" width="114" height="28" fill="#fecdd3" stroke="#9f1239" stroke-width="1.4"/>
  <text x="153" y="190" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#881337">
    Polissilício (p<tspan baseline-shift="super" font-size="75%">+</tspan>)
  </text>

  <!-- 2a camada de Aluminio -->
  <rect x="82" y="120" width="142" height="26" fill="#cbd5e1" stroke="#475569" stroke-width="1.4"/>
  <text x="153" y="137" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">
    2&#170; camada: Alumínio
  </text>

  <!-- Setas de difusao termica autoalinhada -->
  <text x="45" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#c2410c">Difusão</text>
  <line x1="36" y1="166" x2="36" y2="198" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arrow-orange)"/>
  <line x1="54" y1="166" x2="54" y2="198" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arrow-orange)"/>

  <text x="261" y="158" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#c2410c">Difusão</text>
  <line x1="252" y1="166" x2="252" y2="198" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arrow-orange)"/>
  <line x1="270" y1="166" x2="270" y2="198" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="3,2" marker-end="url(#arrow-orange)"/>

  <!-- Destaque C_gd minima (apenas difusao lateral) -->
  <rect x="203" y="200" width="7" height="12" fill="#3b82f6" fill-opacity="0.45" stroke="#1d4ed8" stroke-width="1.3"/>

  <!-- Baixa densidade de cargas fixas (+) em <100> -->
  <circle cx="134" cy="212" r="5.5" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="134" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#dc2626">+</text>
  <circle cx="172" cy="212" r="5.5" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="172" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#dc2626">+</text>
  <text x="153" y="246" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b91c1c">
    Baixa carga
  </text>
  <text x="153" y="260" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#b91c1c">
    fixa (+)
  </text>

  <!-- Nota inferior esquerda -->
  <rect x="14" y="324" width="278" height="40" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="153" y="341" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    Interface &#9001;100&#9002; reduz cargas (+)
  </text>
  <text x="153" y="356" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    e abaixa |V<tspan baseline-shift="sub" font-size="75%">th</tspan>| do transistor
  </text>

  <!-- Coluna direita de cartoes explicativos -->
  <!-- Card 1: Autoalinhamento -->
  <rect x="302" y="44" width="144" height="72" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="374" y="64" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">
    Autoalinhamento
  </text>
  <text x="374" y="84" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    &#916;L<tspan baseline-shift="sub" font-size="75%">align</tspan> = 0 limita L<tspan baseline-shift="sub" font-size="75%">ov</tspan>
  </text>
  <text x="374" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    à difusão lateral
  </text>

  <!-- Card 2: 2 niveis de fiacao -->
  <rect x="302" y="126" width="144" height="72" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="374" y="146" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">
    2 níveis de fiação
  </text>
  <text x="374" y="166" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    Eliminam túneis difusos
  </text>
  <text x="374" y="182" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    e reduzem a área
  </text>
  <line x1="302" y1="134" x2="227" y2="134" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

  <!-- Card 3: C_gd menor -->
  <rect x="302" y="208" width="144" height="72" rx="4" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
  <text x="374" y="228" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#1e40af">
    C<tspan baseline-shift="sub" font-size="75%">gd</tspan> menor (3 a 5&#215;)
  </text>
  <text x="374" y="248" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    Atenua efeito Miller
  </text>
  <text x="374" y="264" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    e atraso em até 5&#215;
  </text>
  <polyline points="302,226 293,226 293,206 212,206" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Card 4: Substrato e p+ -->
  <rect x="302" y="290" width="144" height="74" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="374" y="310" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">
    Substrato &#9001;100&#9002; e p<tspan baseline-shift="super" font-size="75%">+</tspan>
  </text>
  <text x="374" y="330" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    V<tspan baseline-shift="sub" font-size="75%">th</tspan>: &#8722;1,5 a &#8722;2,5 V
  </text>
  <text x="374" y="346" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e293b">
    (compatível com TTL)
  </text>
  <line x1="302" y1="302" x2="288" y2="302" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
</svg>
