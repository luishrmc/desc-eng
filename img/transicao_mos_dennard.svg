<svg xmlns="http://www.w3.org/2000/svg" width="920" height="365" viewBox="0 0 920 365">
  <defs>
    <marker id="arrow-step" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="365" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- BLOCO 1: PMOS SGT (4004, 1971)                                         -->
  <!-- ====================================================================== -->
  <rect x="14" y="12" width="208" height="272" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
  <rect x="14" y="12" width="208" height="52" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6"/>
  <text x="118" y="33" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9a3412">1. PMOS SGT</text>
  <text x="118" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#7c2d12">Intel 4004 (1971)</text>

  <!-- Card 1.1 -->
  <rect x="26" y="76" width="184" height="68" rx="4" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="118" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#9a3412">Portadores: lacunas</text>
  <text x="118" y="114" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#1e293b">&#956;<tspan baseline-shift="sub" font-size="75%">p</tspan> &#8776; 150 a 200 cm&#178;/V&#183;s</text>
  <text x="118" y="131" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">(baixa mobilidade)</text>

  <!-- Card 1.2 -->
  <rect x="26" y="155" width="184" height="53" rx="4" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="118" y="175" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#9a3412">Carga ativa PMOS</text>
  <text x="118" y="194" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#1e293b">Corrente estática contínua</text>

  <!-- Card 1.3 -->
  <rect x="26" y="219" width="184" height="53" rx="4" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <text x="118" y="239" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#9a3412">Fontes +5 V / &#8722;10 V</text>
  <text x="118" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#1e293b">Exige canais largos</text>

  <!-- Seta 1 -> 2 -->
  <line x1="224" y1="148" x2="239" y2="148" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow-step)"/>

  <!-- ====================================================================== -->
  <!-- BLOCO 2: NMOS SGT (8080, 1974 / Z80, 1976)                             -->
  <!-- ====================================================================== -->
  <rect x="242" y="12" width="208" height="272" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.6"/>
  <rect x="242" y="12" width="208" height="52" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="346" y="33" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e3a8a">2. NMOS SGT</text>
  <text x="346" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1e40af">8080 (1974) / Z80 (1976)</text>

  <!-- Card 2.1 -->
  <rect x="254" y="76" width="184" height="68" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="346" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Portadores: elétrons</text>
  <text x="346" y="114" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#1e293b">&#956;<tspan baseline-shift="sub" font-size="75%">n</tspan> &#8776; 500 a 800 cm&#178;/V&#183;s</text>
  <text x="346" y="131" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">(~3&#215; mais rápidos)</text>

  <!-- Card 2.2 -->
  <rect x="254" y="155" width="184" height="53" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="346" y="175" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Níveis TTL diretos</text>
  <text x="346" y="194" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#1e293b">Z80 com +5 V unipolar</text>

  <!-- Card 2.3 -->
  <rect x="254" y="219" width="184" height="53" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="346" y="239" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e3a8a">Carga ativa NMOS</text>
  <text x="346" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#1e293b">Mantém dissipação estática</text>

  <!-- Seta 2 -> 3 -->
  <line x1="452" y1="148" x2="467" y2="148" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow-step)"/>

  <!-- ====================================================================== -->
  <!-- BLOCO 3: CMOS E ESCALAMENTO DE DENNARD (1974 a 2000)                   -->
  <!-- ====================================================================== -->
  <rect x="470" y="12" width="208" height="272" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <rect x="470" y="12" width="208" height="52" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
  <text x="574" y="33" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">3. CMOS e Dennard</text>
  <text x="574" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#047857">Escalamento (1974 a 2000)</text>

  <!-- Card 3.1 -->
  <rect x="482" y="76" width="184" height="68" rx="4" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="574" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">Par pMOS + nMOS</text>
  <text x="574" y="114" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#1e293b">Corta corrente em repouso</text>
  <text x="574" y="131" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#047857">(gasto só na troca de bit)</text>

  <!-- Card 3.2 -->
  <rect x="482" y="155" width="184" height="53" rx="4" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="574" y="175" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">Redução por fator &#954;</text>
  <text x="574" y="194" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#1e293b">Densidade &#215;&#954;&#178; | Vel. &#215;&#954;</text>

  <!-- Card 3.3 -->
  <rect x="482" y="219" width="184" height="53" rx="4" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.2"/>
  <text x="574" y="239" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">Potência/área constante</text>
  <text x="574" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#1e293b">Base da Lei de Moore</text>

  <!-- Seta 3 -> 4 -->
  <line x1="680" y1="148" x2="695" y2="148" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow-step)"/>

  <!-- ====================================================================== -->
  <!-- BLOCO 4: POS-2000: LIMITES E DTCO                                      -->
  <!-- ====================================================================== -->
  <rect x="698" y="12" width="208" height="272" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
  <rect x="698" y="12" width="208" height="52" rx="6" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="802" y="33" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#4c1d95">4. Pós-2000</text>
  <text x="802" y="50" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5b21b6">Limites Físicos e DTCO</text>

  <!-- Card 4.1 -->
  <rect x="710" y="76" width="184" height="68" rx="4" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="802" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4c1d95">Tensão estagna em ~1 V</text>
  <text x="802" y="114" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#1e293b">Fuga de corrente e</text>
  <text x="802" y="131" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#1e293b">tunelamento quântico</text>

  <!-- Card 4.2 -->
  <rect x="710" y="155" width="184" height="53" rx="4" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="802" y="175" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4c1d95">Barreira de potência</text>
  <text x="802" y="194" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#1e293b">Exige vários núcleos</text>

  <!-- Card 4.3 -->
  <rect x="710" y="219" width="184" height="53" rx="4" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="802" y="239" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#4c1d95">Co-otimização (DTCO)</text>
  <text x="802" y="258" font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" text-anchor="middle" fill="#1e293b">Processo e arquitetura</text>

  <!-- ====================================================================== -->
  <!-- FAIXA DE RODAPE: SINTESE DA TRANSICAO                                  -->
  <!-- ====================================================================== -->
  <rect x="14" y="297" width="892" height="56" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="460" y="319" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Síntese da Transição: dos limites térmicos do PMOS à co-otimização processo-arquitetura (DTCO)</text>
  <text x="460" y="339" font-family="DejaVu Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#334155">O escalamento de Dennard multiplicou densidade e frequência até o teto térmico de ~1 V, exigindo o enfoque integrado de Faggin.</text>
</svg>
