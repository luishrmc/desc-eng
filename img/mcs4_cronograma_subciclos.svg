  <text x="278" y="369" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#92400e">Execução ULA e RAM</text>

  <rect x="374" y="355" width="90" height="19" rx="3" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
