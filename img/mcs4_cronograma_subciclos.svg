  <rect x="92" y="355" width="90" height="19" rx="3" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="137" y="369" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#065f46">ROM &#8594; CPU</text>

