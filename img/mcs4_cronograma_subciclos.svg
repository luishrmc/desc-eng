    8 períodos &#215; 1,35 &#956;s (740,7 kHz)  |  Fases &#966;<tspan baseline-shift="sub" font-size="75%">1</tspan>, &#966;<tspan baseline-shift="sub" font-size="75%">2</tspan> não sobrepostas
  </text>

  <!-- ====================================================================== -->
  <!-- FAIXA 1: SUBCICLOS A1 A M1                                             -->
