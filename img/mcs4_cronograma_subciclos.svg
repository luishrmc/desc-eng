  <text x="82" y="129" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#0f172a">Fase &#966;<tspan baseline-shift="sub" font-size="75%">2</tspan></text>
  <text x="82" y="155" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#dc2626">SYNC</text>
  <text x="82" y="185" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#1e3a8a">D<tspan baseline-shift="sub" font-size="75%">0</tspan> a D<tspan baseline-shift="sub" font-size="75%">3</tspan></text>

  <!-- Fundo colorido das colunas (x=90..466, 4 cols de 94 px) -->
  <rect x="90" y="86" width="282" height="114" fill="#eff6ff" fill-opacity="0.6"/>
  <rect x="372" y="86" width="94" height="114" fill="#ecfdf5" fill-opacity="0.6"/>

