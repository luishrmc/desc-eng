  <text x="82" y="281" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#0f172a">Fase &#966;<tspan baseline-shift="sub" font-size="75%">2</tspan></text>
  <text x="82" y="307" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#dc2626">SYNC</text>
  <text x="82" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="end" fill="#1e3a8a">D<tspan baseline-shift="sub" font-size="75%">0</tspan> a D<tspan baseline-shift="sub" font-size="75%">3</tspan></text>

