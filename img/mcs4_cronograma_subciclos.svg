      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="480" height="388" fill="#ffffff"/>

  <rect x="4" y="4" width="472" height="380" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="4" y="4" width="472" height="30" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="24" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Cronograma do ciclo de instrução de 10,8 &#956;s</text>

  <!-- Subtitulo tecnico -->
  <rect x="14" y="39" width="452" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
