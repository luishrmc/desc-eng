<svg xmlns="http://www.w3.org/2000/svg" width="460" height="330" viewBox="0 0 460 330">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="460" height="330" fill="#ffffff"/>

  <rect x="4" y="4" width="452" height="322" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="4" y="4" width="452" height="30" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="230" y="24" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Circuito equivalente de atraso e carga</text>

  <!-- Alimentacao e R_on alimentando V_out -->
  <text x="52" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#334155">Trilho</text>
  <line x1="76" y1="71" x2="102" y2="71" stroke="#1e293b" stroke-width="2"/>
  <polyline points="102,71 108,63 118,79 128,63 138,79 148,63 154,71" fill="none" stroke="#1e293b" stroke-width="2"/>
  <text x="128" y="56" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#0f172a">R<tspan baseline-shift="sub" font-size="75%">on</tspan></text>

  <!-- Fio continuo ate o no V_out e seta paralela I_on -->
  <line x1="154" y1="71" x2="230" y2="71" stroke="#1e293b" stroke-width="2"/>
  <line x1="230" y1="71" x2="230" y2="106" stroke="#1e293b" stroke-width="2"/>
  <line x1="164" y1="61" x2="220" y2="61" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="192" y="52" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1d4ed8">I<tspan baseline-shift="sub" font-size="75%">on</tspan></text>

  <!-- No V_out -->
  <circle cx="230" cy="106" r="4" fill="#2563eb"/>
  <text x="284" y="77" font-family="DejaVu Sans, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1e3a8a">Nó V<tspan baseline-shift="sub" font-size="75%">out</tspan></text>
  <line x1="234" y1="102" x2="274" y2="79" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Barramento horizontal distribuindo para os 4 termos de C_L -->
  <line x1="66" y1="106" x2="394" y2="106" stroke="#1e293b" stroke-width="2"/>

  <!-- Ramo 1 (x=66): C_gd(1 + |A_v|) -->
  <line x1="66" y1="106" x2="66" y2="142" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="50" y1="142" x2="82" y2="142" stroke="#dc2626" stroke-width="2.6"/>
  <line x1="50" y1="152" x2="82" y2="152" stroke="#dc2626" stroke-width="2.6"/>
  <line x1="66" y1="152" x2="66" y2="224" stroke="#dc2626" stroke-width="1.8"/>
  <rect x="18" y="160" width="96" height="56" rx="2" fill="#fafafa"/>
  <text x="66" y="175" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b91c1c">C<tspan baseline-shift="sub" font-size="75%">gd</tspan>(1+|A<tspan baseline-shift="sub" font-size="75%">v</tspan>|)</text>
  <text x="66" y="193" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#7f1d1d">Efeito Miller</text>
  <text x="66" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#991b1b">(A<tspan baseline-shift="sub" font-size="75%">v</tspan> = &#8722;g<tspan baseline-shift="sub" font-size="75%">m</tspan>R<tspan baseline-shift="sub" font-size="75%">L</tspan>)</text>

  <!-- Ramo 2 (x=176): C_gate,next -->
  <line x1="176" y1="106" x2="176" y2="142" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="160" y1="142" x2="192" y2="142" stroke="#1e293b" stroke-width="2.6"/>
  <line x1="160" y1="152" x2="192" y2="152" stroke="#1e293b" stroke-width="2.6"/>
  <line x1="176" y1="152" x2="176" y2="224" stroke="#1e293b" stroke-width="1.8"/>
  <rect x="134" y="160" width="84" height="54" rx="2" fill="#fafafa"/>
  <text x="176" y="175" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">C<tspan baseline-shift="sub" font-size="75%">gate,next</tspan></text>
  <text x="176" y="193" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#475569">Estágios</text>
  <text x="176" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#475569">seguintes</text>

  <!-- Ramo 3 (x=286): C_junc -->
  <line x1="286" y1="106" x2="286" y2="142" stroke="#c2410c" stroke-width="1.8"/>
  <line x1="270" y1="142" x2="302" y2="142" stroke="#c2410c" stroke-width="2.6"/>
  <line x1="270" y1="152" x2="302" y2="152" stroke="#c2410c" stroke-width="2.6"/>
  <line x1="286" y1="152" x2="286" y2="224" stroke="#c2410c" stroke-width="1.8"/>
  <rect x="248" y="160" width="76" height="54" rx="2" fill="#fafafa"/>
  <text x="286" y="175" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9a3412">C<tspan baseline-shift="sub" font-size="75%">junc</tspan></text>
  <text x="286" y="193" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#7c2d12">Junções</text>
  <text x="286" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#7c2d12">reversas</text>

  <!-- Ramo 4 (x=394): C_wire -->
  <line x1="394" y1="106" x2="394" y2="142" stroke="#0891b2" stroke-width="1.8"/>
  <line x1="378" y1="142" x2="410" y2="142" stroke="#0891b2" stroke-width="2.6"/>
  <line x1="378" y1="152" x2="410" y2="152" stroke="#0891b2" stroke-width="2.6"/>
  <line x1="394" y1="152" x2="394" y2="224" stroke="#0891b2" stroke-width="1.8"/>
  <rect x="352" y="160" width="84" height="54" rx="2" fill="#fafafa"/>
  <text x="394" y="175" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0e7490">C<tspan baseline-shift="sub" font-size="75%">wire</tspan></text>
  <text x="394" y="193" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#155e75">Fiação</text>
  <text x="394" y="209" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#155e75">distribuída</text>

  <!-- Barramento inferior de referencia AC -->
  <line x1="66" y1="224" x2="394" y2="224" stroke="#1e293b" stroke-width="2"/>
  <line x1="230" y1="224" x2="230" y2="234" stroke="#1e293b" stroke-width="2"/>
  <line x1="214" y1="234" x2="246" y2="234" stroke="#1e293b" stroke-width="2"/>
  <line x1="220" y1="239" x2="240" y2="239" stroke="#1e293b" stroke-width="1.6"/>
  <line x1="226" y1="244" x2="234" y2="244" stroke="#1e293b" stroke-width="1.4"/>

  <!-- Caixa resumo das equacoes de atraso e carga total -->
  <rect x="18" y="252" width="424" height="66" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="230" y="271" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#0f172a">
    C<tspan baseline-shift="sub" font-size="75%">L</tspan> = C<tspan baseline-shift="sub" font-size="75%">gd</tspan>(1+|A<tspan baseline-shift="sub" font-size="75%">v</tspan>|) + C<tspan baseline-shift="sub" font-size="75%">gate,next</tspan> + C<tspan baseline-shift="sub" font-size="75%">junc</tspan> + C<tspan baseline-shift="sub" font-size="75%">wire</tspan>
  </text>
  <text x="230" y="291" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e3a8a">
    &#964;<tspan baseline-shift="sub" font-size="75%">pd</tspan> &#8776; 0,69 R<tspan baseline-shift="sub" font-size="75%">on</tspan>C<tspan baseline-shift="sub" font-size="75%">L</tspan> &#8776; C<tspan baseline-shift="sub" font-size="75%">L</tspan>&#916;V / I<tspan baseline-shift="sub" font-size="75%">on</tspan>
  </text>
  <text x="230" y="311" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">
    SGT reduz C<tspan baseline-shift="sub" font-size="75%">gd</tspan> (3 a 5&#215;) e C<tspan baseline-shift="sub" font-size="75%">wire</tspan> &#8594; &#964;<tspan baseline-shift="sub" font-size="75%">pd</tspan> até 5&#215; menor
  </text>
</svg>
