<svg xmlns="http://www.w3.org/2000/svg" width="480" height="355" viewBox="0 0 480 355">
  <rect x="0" y="0" width="480" height="355" fill="#ffffff"/>

  <rect x="4" y="4" width="472" height="347" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="4" y="4" width="472" height="30" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="24" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Topologias de carga PMOS (V<tspan baseline-shift="sub" font-size="75%">SS</tspan> = +5 V a V<tspan baseline-shift="sub" font-size="75%">DD</tspan> = &#8722;10 V)</text>

  <!-- SUBPAINEL ESQUERDO: CARGA CONVENCIONAL -->
  <rect x="14" y="42" width="194" height="298" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="111" y="61" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Carga PMOS convencional</text>

  <!-- Trilho V_SS = +5 V -->
  <line x1="79" y1="80" x2="143" y2="80" stroke="#1e293b" stroke-width="2"/>
  <text x="111" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">SS</tspan> (+5 V)</text>
  <line x1="111" y1="80" x2="111" y2="96" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Transistor M_in -->
  <polyline points="111,96 97,96 97,128 111,128" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="91" y1="98" x2="91" y2="126" stroke="#1e293b" stroke-width="2.2"/>
  <circle cx="85" cy="112" r="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="55" y1="112" x2="82" y2="112" stroke="#1e293b" stroke-width="1.8"/>
  <text x="39" y="116" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1e293b">V<tspan baseline-shift="sub" font-size="75%">in</tspan></text>
  <text x="123" y="116" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">M<tspan baseline-shift="sub" font-size="75%">in</tspan></text>

  <!-- No V_out -->
  <line x1="111" y1="128" x2="111" y2="170" stroke="#1e293b" stroke-width="1.8"/>
  <circle cx="111" cy="149" r="3.5" fill="#dc2626"/>
  <line x1="111" y1="149" x2="161" y2="149" stroke="#dc2626" stroke-width="1.8"/>
  <text x="181" y="153" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#b91c1c">V<tspan baseline-shift="sub" font-size="75%">out</tspan></text>

  <!-- Transistor M_load convencional -->
  <polyline points="111,170 97,170 97,206 111,206" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="91" y1="172" x2="91" y2="204" stroke="#1e293b" stroke-width="2.2"/>
  <circle cx="85" cy="188" r="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="119" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#475569">S</text>
  <text x="119" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#475569">D</text>
  <text x="127" y="192" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">M<tspan baseline-shift="sub" font-size="75%">load</tspan></text>

  <!-- Porta ligada fixa em V_DD -->
  <line x1="82" y1="188" x2="55" y2="188" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="55" y1="188" x2="55" y2="230" stroke="#dc2626" stroke-width="1.8"/>
  <line x1="55" y1="230" x2="143" y2="230" stroke="#1e293b" stroke-width="2"/>
  <line x1="111" y1="206" x2="111" y2="230" stroke="#1e293b" stroke-width="1.8"/>
  <circle cx="111" cy="230" r="3" fill="#1e293b"/>
  <text x="111" y="246" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">DD</tspan> (&#8722;10 V)</text>

  <!-- Resultado convencional -->
  <rect x="22" y="260" width="178" height="70" rx="4" fill="#fef2f2" stroke="#ef4444" stroke-width="1.2"/>
  <text x="111" y="279" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Porta fixa em V<tspan baseline-shift="sub" font-size="75%">DD</tspan></text>
  <text x="111" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#7f1d1d">Corta em V<tspan baseline-shift="sub" font-size="75%">out</tspan>=V<tspan baseline-shift="sub" font-size="75%">DD</tspan>+|V<tspan baseline-shift="sub" font-size="75%">th</tspan>|</text>
  <text x="111" y="317" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#991b1b">(estanca perto de &#8722;8 V)</text>

  <!-- SUBPAINEL DIREITO: CARGA COM BOOTSTRAPPING DINAMICO -->
  <rect x="216" y="42" width="250" height="298" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
  <text x="341" y="61" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Carga com bootstrapping dinâmico</text>

  <!-- Trilho V_SS = +5 V -->
  <line x1="346" y1="80" x2="414" y2="80" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="75" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">SS</tspan> (+5 V)</text>
  <line x1="380" y1="80" x2="380" y2="96" stroke="#1e293b" stroke-width="1.8"/>

  <!-- Transistor M_in -->
  <polyline points="380,96 366,96 366,126 380,126" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="360" y1="98" x2="360" y2="124" stroke="#1e293b" stroke-width="2.2"/>
  <circle cx="354" cy="111" r="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="330" y1="111" x2="351" y2="111" stroke="#1e293b" stroke-width="1.8"/>
  <text x="319" y="115" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1e293b">V<tspan baseline-shift="sub" font-size="75%">in</tspan></text>
  <text x="392" y="115" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">M<tspan baseline-shift="sub" font-size="75%">in</tspan></text>

  <!-- No V_out + ligacao para C_B -->
  <line x1="380" y1="126" x2="380" y2="172" stroke="#1e293b" stroke-width="1.8"/>
  <circle cx="380" cy="144" r="3.5" fill="#2563eb"/>
  <line x1="380" y1="144" x2="424" y2="144" stroke="#2563eb" stroke-width="1.8"/>
  <text x="444" y="148" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">V<tspan baseline-shift="sub" font-size="75%">out</tspan></text>

  <!-- Transistor M_load com porta no no flutuante N_G -->
  <polyline points="380,172 366,172 366,208 380,208" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="360" y1="174" x2="360" y2="206" stroke="#1e293b" stroke-width="2.2"/>
  <circle cx="354" cy="190" r="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="388" y="176" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#475569">S</text>
  <text x="388" y="212" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#475569">D</text>
  <text x="397" y="194" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">M<tspan baseline-shift="sub" font-size="75%">load</tspan></text>

  <!-- Trilho V_DD = -10 V em M_load -->
  <line x1="380" y1="208" x2="380" y2="230" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="346" y1="230" x2="414" y2="230" stroke="#1e293b" stroke-width="2"/>
  <text x="380" y="246" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">DD</tspan> (&#8722;10 V)</text>

  <!-- No flutuante N_G -->
  <line x1="310" y1="190" x2="351" y2="190" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="310" cy="190" r="4" fill="#7c3aed"/>
  <text x="334" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#6d28d9">N<tspan baseline-shift="sub" font-size="75%">G</tspan></text>

  <!-- Capacitor C_B entre V_out e N_G -->
  <line x1="380" y1="144" x2="310" y2="144" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="310" y1="144" x2="310" y2="162" stroke="#2563eb" stroke-width="1.8"/>
  <line x1="296" y1="162" x2="324" y2="162" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="296" y1="171" x2="324" y2="171" stroke="#2563eb" stroke-width="2.6"/>
  <line x1="310" y1="171" x2="310" y2="190" stroke="#2563eb" stroke-width="1.8"/>
  <text x="338" y="171" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1d4ed8">C<tspan baseline-shift="sub" font-size="75%">B</tspan></text>

  <!-- Capacitancia parasita C_P -->
  <line x1="310" y1="190" x2="310" y2="212" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="300" y1="212" x2="320" y2="212" stroke="#64748b" stroke-width="2"/>
  <line x1="300" y1="219" x2="320" y2="219" stroke="#64748b" stroke-width="2"/>
  <line x1="310" y1="219" x2="310" y2="234" stroke="#64748b" stroke-width="1.5"/>
  <line x1="300" y1="234" x2="320" y2="234" stroke="#64748b" stroke-width="1.8"/>
  <line x1="304" y1="238" x2="316" y2="238" stroke="#64748b" stroke-width="1.4"/>
  <text x="276" y="224" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#475569">C<tspan baseline-shift="sub" font-size="75%">P</tspan></text>
  <text x="266" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#334155">(C<tspan baseline-shift="sub" font-size="75%">B</tspan>&#8811;C<tspan baseline-shift="sub" font-size="75%">P</tspan>)</text>

  <!-- Transistor de isolamento/amostragem M_iso -->
  <polyline points="248,190 248,177 280,177 280,190" fill="none" stroke="#1e293b" stroke-width="1.8"/>
  <line x1="250" y1="171" x2="278" y2="171" stroke="#1e293b" stroke-width="2.2"/>
  <circle cx="264" cy="165" r="3" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="264" y1="148" x2="264" y2="162" stroke="#1e293b" stroke-width="1.6"/>
  <text x="264" y="142" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#334155">Pré-carga</text>
  <text x="264" y="205" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">M<tspan baseline-shift="sub" font-size="75%">iso</tspan></text>
  <line x1="280" y1="190" x2="310" y2="190" stroke="#7c3aed" stroke-width="1.8"/>
  <line x1="220" y1="190" x2="248" y2="190" stroke="#1e293b" stroke-width="1.8"/>
  <text x="230" y="181" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">V<tspan baseline-shift="sub" font-size="75%">DD</tspan></text>

  <!-- Resultado com bootstrapping -->
  <rect x="224" y="260" width="234" height="70" rx="4" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.2"/>
  <text x="341" y="279" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">C<tspan baseline-shift="sub" font-size="75%">B</tspan> acopla &#916;V<tspan baseline-shift="sub" font-size="75%">out</tspan> ao nó N<tspan baseline-shift="sub" font-size="75%">G</tspan></text>
  <text x="341" y="298" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#065f46">|V<tspan baseline-shift="sub" font-size="75%">G</tspan>(t)| &gt; |V<tspan baseline-shift="sub" font-size="75%">DD</tspan>| (abaixo de &#8722;10 V)</text>
  <text x="341" y="317" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#047857">Excursão plena: V<tspan baseline-shift="sub" font-size="75%">out</tspan> = V<tspan baseline-shift="sub" font-size="75%">DD</tspan> (&#8722;10 V)</text>
</svg>
