<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="380" fill="#ffffff"/>

  <!-- ====================================================================== -->
  <!-- PAINEL (a): CONTATO CONVENCIONAL VS. CONTATO ENTERRADO                 -->
  <!-- ====================================================================== -->
  <rect x="12" y="10" width="452" height="360" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="12" y="10" width="452" height="32" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="238" y="31" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">(a) Corte transversal: Contato Convencional vs. Enterrado</text>

  <!-- TOPO: CONTATO CONVENCIONAL -->
  <text x="238" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Contato Convencional (2 janelas verticais + ponte de Al)</text>

  <!-- Cota largura convencional -->
  <line x1="78" y1="86" x2="78" y2="71" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="376" y1="86" x2="376" y2="71" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="77" x2="374" y2="77" stroke="#dc2626" stroke-width="1.4" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="227" y="73" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#b91c1c">Área extensa (folgas litográficas + 2 vias)</text>

  <!-- Substrato Si n -->
  <rect x="36" y="152" width="404" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="295" y="175" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e3a8a">Substrato Si tipo n</text>

  <!-- Difusao p+ -->
  <rect x="46" y="152" width="168" height="22" fill="#ffedd5" stroke="#c2410c" stroke-width="1.3"/>
  <text x="130" y="167" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7c2d12">Difusão p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <!-- Oxido isolante com janela 1 aberta (x=96..136) e suporte do poli -->
  <rect x="36" y="136" width="60" height="16" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="136" y="136" width="304" height="16" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>

  <!-- Polissilicio p+ sobre o oxido -->
  <rect x="244" y="122" width="164" height="14" fill="#fecdd3" stroke="#9f1239" stroke-width="1.3"/>
  <text x="282" y="133" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#881337">Poli p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <!-- Oxido superior com janela 2 aberta (x=316..356) -->
  <rect x="236" y="106" width="80" height="16" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="356" y="106" width="60" height="16" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>

  <!-- Ponte de Aluminio descendo pelas 2 vias -->
  <polygon points="78,86 376,86 376,106 356,106 356,122 316,122 316,106 136,106 136,152 96,152 96,106 78,106" fill="#cbd5e1" stroke="#334155" stroke-width="1.4"/>
  <text x="227" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Ponte de Alumínio</text>
  <text x="116" y="127" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1e293b">Via 1</text>
  <text x="336" y="118" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1e293b">Via 2</text>

  <!-- Separador horizontal -->
  <line x1="24" y1="194" x2="452" y2="194" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- BASE: CONTATO ENTERRADO (FAGGIN) -->
  <text x="24" y="213" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#065f46">Contato Enterrado (aplicado por Faggin no 4004)</text>

  <!-- Guias curtas de comparacao apenas na faixa superior/separadora (y=194..244) -->
  <line x1="78" y1="224" x2="78" y2="244" stroke="#059669" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="228" y1="224" x2="228" y2="244" stroke="#059669" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="376" y1="194" x2="376" y2="244" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="3,2"/>

  <!-- Cota largura reduzida (~50% menor) e extensao convencional tracejada -->
  <line x1="80" y1="234" x2="226" y2="234" stroke="#059669" stroke-width="1.6" marker-start="url(#arrow-emerald)" marker-end="url(#arrow-emerald)"/>
  <line x1="228" y1="234" x2="376" y2="234" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="342" y="257" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">~50% menos área celular</text>

  <!-- Substrato Si n -->
  <rect x="36" y="316" width="404" height="38" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="330" y="340" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e3a8a">Substrato Si tipo n</text>

  <!-- Juncao omica p+ continua alinhada em x=78 -->
  <rect x="78" y="316" width="132" height="24" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/>
  <text x="144" y="332" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#7c2d12">Junção ôhmica p<tspan baseline-shift="super" font-size="75%">+</tspan> contínua</text>

  <!-- Oxido de porta/campo aberto ANTES do polissilicio (janela x=122..182) -->
  <rect x="36" y="300" width="86" height="16" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="182" y="300" width="258" height="16" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>

  <!-- Polissilicio p+ em contato direto com o substrato (termina em x=228) -->
  <polygon points="96,278 228,278 228,300 182,300 182,316 122,316 122,300 96,300" fill="#fecdd3" stroke="#9f1239" stroke-width="1.4"/>
  <text x="168" y="293" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#881337">Polissilício p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <!-- Oxido superior continuo (sem vias metalicas) -->
  <rect x="88" y="266" width="148" height="12" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>

  <!-- Nota explicativa do fluxo -->
  <rect x="252" y="266" width="196" height="44" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.1"/>
  <text x="350" y="283" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#065f46">Janela aberta antes do poli;</text>
  <text x="350" y="300" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#065f46">difusão de boro une poli e Si</text>

  <!-- ====================================================================== -->
  <!-- PAINEL (b): PLANTA SUPERIOR DO ROTEAMENTO ORTOGONAL EM 2 CAMADAS       -->
  <!-- ====================================================================== -->
  <rect x="476" y="10" width="432" height="360" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="476" y="10" width="432" height="32" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="692" y="31" font-family="DejaVu Sans, Arial, sans-serif" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#0f172a">(b) Planta superior: Roteamento Ortogonal (2 camadas)</text>

  <!-- Indicador de direcoes ortogonais -->
  <rect x="490" y="48" width="404" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="692" y="64" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e293b">
    Polissilício p<tspan baseline-shift="super" font-size="75%">+</tspan>: eixo vertical (&#8597;)
    &#160;&#160;|&#160;&#160;
    Alumínio: eixo horizontal (&#8596;)
  </text>

  <!-- Area do leiaute (oxido de campo) -->
  <rect x="490" y="78" width="404" height="214" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Difusao p+ ativa superior (x=524..692, y=110..144) e inferior (x=612..852, y=198..232) -->
  <rect x="524" y="110" width="168" height="34" rx="2" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/>
  <rect x="612" y="198" width="244" height="34" rx="2" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/>

  <!-- Trilhas verticais de Polissilicio p+ -->
  <rect x="576" y="84" width="22" height="176" fill="#fecdd3" fill-opacity="0.9" stroke="#9f1239" stroke-width="1.4"/>
  <rect x="664" y="84" width="22" height="176" fill="#fecdd3" fill-opacity="0.9" stroke="#9f1239" stroke-width="1.4"/>
  <rect x="822" y="84" width="22" height="176" fill="#fecdd3" fill-opacity="0.9" stroke="#9f1239" stroke-width="1.4"/>

  <!-- Destaque dos Transistores PMOS nos cruzamentos Poly x Difusao -->
  <rect x="574" y="108" width="26" height="38" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="3,2"/>
  <rect x="662" y="196" width="26" height="38" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="3,2"/>

  <!-- Contatos enterrados (Poly direto na difusao p+) -->
  <rect x="666" y="114" width="18" height="26" fill="#fed7aa" stroke="#9a3412" stroke-width="1.8"/>
  <line x1="666" y1="114" x2="684" y2="140" stroke="#9a3412" stroke-width="1.5"/>
  <line x1="684" y1="114" x2="666" y2="140" stroke="#9a3412" stroke-width="1.5"/>

  <rect x="824" y="202" width="18" height="26" fill="#fed7aa" stroke="#9a3412" stroke-width="1.8"/>
  <line x1="824" y1="202" x2="842" y2="228" stroke="#9a3412" stroke-width="1.5"/>
  <line x1="842" y1="202" x2="824" y2="228" stroke="#9a3412" stroke-width="1.5"/>

  <!-- Trilhas horizontais de Aluminio (2a camada superior) -->
  <rect x="504" y="88" width="376" height="16" fill="#cbd5e1" fill-opacity="0.86" stroke="#334155" stroke-width="1.4"/>
  <rect x="504" y="160" width="376" height="16" fill="#cbd5e1" fill-opacity="0.86" stroke="#334155" stroke-width="1.4"/>

  <!-- Vias metal-polissilicio -->
  <rect x="580" y="89" width="14" height="14" fill="#334155" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="587" cy="96" r="3" fill="#ffffff"/>

  <rect x="826" y="161" width="14" height="14" fill="#334155" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="833" cy="168" r="3" fill="#ffffff"/>

  <!-- Chamadas limpas dentro da planta superior -->
  <!-- Via Al-Poly -->
  <text x="536" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#0f172a">Via</text>
  <line x1="550" y1="96" x2="578" y2="96" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow-dark)"/>

  <!-- Transistor PMOS -->
  <text x="546" y="216" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0e7490">Transistor</text>
  <text x="546" y="231" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0e7490">PMOS</text>
  <line x1="556" y1="201" x2="582" y2="148" stroke="#0891b2" stroke-width="1.3" marker-end="url(#arrow-dark)"/>

  <!-- Cruzamento isolado sem tunel difuso (espaco aberto x=694..818) -->
  <text x="756" y="126" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#334155">Cruzamento isolado</text>
  <text x="756" y="141" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#475569">(sem túnel difuso)</text>
  <line x1="712" y1="144" x2="689" y2="160" stroke="#334155" stroke-width="1.3" marker-end="url(#arrow-dark)"/>

  <!-- Contato enterrado -->
  <text x="692" y="278" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#9a3412">Contato enterrado (Poly + p<tspan baseline-shift="super" font-size="75%">+</tspan>)</text>
  <line x1="752" y1="265" x2="823" y2="229" stroke="#9a3412" stroke-width="1.3" marker-end="url(#arrow-dark)"/>

  <!-- Legenda inferior do Painel (b) -->
  <rect x="490" y="300" width="404" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

  <!-- Linha 1 legenda -->
  <rect x="502" y="311" width="14" height="12" fill="#ffedd5" stroke="#c2410c" stroke-width="1.2"/>
  <text x="522" y="321" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Difusão p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <rect x="610" y="311" width="14" height="12" fill="#fecdd3" stroke="#9f1239" stroke-width="1.2"/>
  <text x="630" y="321" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Polissilício p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <rect x="734" y="311" width="14" height="12" fill="#cbd5e1" stroke="#334155" stroke-width="1.2"/>
  <text x="754" y="321" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Alumínio (2ª cam.)</text>

  <!-- Linha 2 legenda -->
  <rect x="502" y="335" width="14" height="12" fill="none" stroke="#0891b2" stroke-width="1.6" stroke-dasharray="2,1.5"/>
  <text x="522" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Canal PMOS</text>

  <rect x="610" y="335" width="14" height="12" fill="#fed7aa" stroke="#9a3412" stroke-width="1.4"/>
  <line x1="610" y1="335" x2="624" y2="347" stroke="#9a3412" stroke-width="1.2"/>
  <line x1="624" y1="335" x2="610" y2="347" stroke="#9a3412" stroke-width="1.2"/>
  <text x="630" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Contato enterr.</text>

  <rect x="734" y="335" width="14" height="12" fill="#334155" stroke="#0f172a" stroke-width="1"/>
  <circle cx="741" cy="341" r="2.5" fill="#ffffff"/>
  <text x="754" y="345" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" fill="#1e293b">Via Al / Polissilício</text>
</svg>
