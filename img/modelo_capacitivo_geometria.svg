<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340">
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="480" height="340" fill="#ffffff"/>

  <rect x="4" y="4" width="472" height="332" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="4" y="4" width="472" height="30" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="240" y="24" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Geometria parametrizada da sobreposição</text>

  <!-- Barra de relacoes geometricas -->
  <rect x="14" y="41" width="452" height="26" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="240" y="58" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1e293b">
    C<tspan baseline-shift="sub" font-size="75%">ox</tspan> = &#949;<tspan baseline-shift="sub" font-size="75%">ox</tspan>/t<tspan baseline-shift="sub" font-size="75%">ox</tspan>
    &#160;&#160;|&#160;&#160;
    C<tspan baseline-shift="sub" font-size="75%">ov</tspan> = C<tspan baseline-shift="sub" font-size="75%">ox</tspan>&#183;W&#183;L<tspan baseline-shift="sub" font-size="75%">ov</tspan>
    &#160;&#160;|&#160;&#160;
    L<tspan baseline-shift="sub" font-size="75%">diff,lat</tspan> &#8776; 0,75 x<tspan baseline-shift="sub" font-size="75%">j</tspan>
  </text>

  <!-- DISPOSITIVO SUPERIOR: PORTA DE ALUMINIO -->
  <text x="16" y="88" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Porta metálica de alumínio</text>
  <rect x="254" y="73" width="212" height="22" rx="3" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="360" y="88" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#991b1b">
    L<tspan baseline-shift="sub" font-size="75%">ov,metal</tspan> = &#916;L<tspan baseline-shift="sub" font-size="75%">align</tspan> + L<tspan baseline-shift="sub" font-size="75%">diff,lat</tspan>
  </text>

  <!-- Substrato n -->
  <rect x="38" y="152" width="338" height="38" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="207" y="183" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1e3a8a">Substrato Si tipo n</text>

  <!-- Fonte e Dreno p+ -->
  <rect x="46" y="152" width="90" height="22" fill="#ffedd5" stroke="#c2410c" stroke-width="1.3"/>
  <text x="91" y="167" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#7c2d12">Fonte p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <rect x="266" y="152" width="92" height="22" fill="#ffedd5" stroke="#c2410c" stroke-width="1.3"/>
  <text x="312" y="167" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#7c2d12">Dreno p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <!-- Profundidade x_j -->
  <line x1="28" y1="152" x2="44" y2="152" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="28" y1="174" x2="44" y2="174" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="32" y1="154" x2="32" y2="172" stroke="#334155" stroke-width="1.2" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
  <text x="20" y="167" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#0f172a">x<tspan baseline-shift="sub" font-size="75%">j</tspan></text>

  <!-- Oxido fino de porta -->
  <rect x="84" y="142" width="238" height="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="266" y="142" width="56" height="10" fill="#ef4444" fill-opacity="0.32" stroke="#dc2626" stroke-width="1.2"/>

  <!-- Porta de Aluminio + 3D W -->
  <polygon points="84,122 100,110 338,110 322,122" fill="#e2e8f0" stroke="#475569" stroke-width="1.2"/>
  <polygon points="322,122 338,110 338,130 322,142" fill="#94a3b8" stroke="#475569" stroke-width="1.2"/>
  <rect x="84" y="122" width="238" height="20" fill="#cbd5e1" stroke="#475569" stroke-width="1.3"/>
  <text x="203" y="136" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#0f172a">Alumínio (porta)</text>

  <!-- Cota largura W na aresta 3D -->
  <line x1="330" y1="142" x2="346" y2="130" stroke="#1e293b" stroke-width="1.2" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
  <text x="353" y="140" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">W</text>

  <!-- Cota t_ox no oxido -->
  <line x1="380" y1="142" x2="404" y2="142" stroke="#0891b2" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="380" y1="152" x2="404" y2="152" stroke="#0891b2" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="398" y1="130" x2="398" y2="140" stroke="#0891b2" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
  <line x1="398" y1="164" x2="398" y2="154" stroke="#0891b2" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
  <text x="410" y="151" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#0e7490">t<tspan baseline-shift="sub" font-size="75%">ox</tspan>, &#949;<tspan baseline-shift="sub" font-size="75%">ox</tspan></text>

  <!-- Guias e cotas de L_diff,lat e Delta L_align -->
  <line x1="266" y1="152" x2="266" y2="97" stroke="#c2410c" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="284" y1="152" x2="284" y2="97" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="322" y1="122" x2="322" y2="97" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="267" y1="101" x2="283" y2="101" stroke="#c2410c" stroke-width="1.4"/>
  <line x1="286" y1="101" x2="320" y2="101" stroke="#dc2626" stroke-width="1.4" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="208" y="103" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#9a3412">L<tspan baseline-shift="sub" font-size="75%">diff,lat</tspan></text>
  <line x1="234" y1="101" x2="264" y2="101" stroke="#c2410c" stroke-width="1.1"/>
  <text x="398" y="105" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#dc2626">&#916;L<tspan baseline-shift="sub" font-size="75%">align</tspan> (3 a 5 &#956;m)</text>
  <line x1="324" y1="101" x2="345" y2="101" stroke="#dc2626" stroke-width="1.1"/>

  <!-- Separador horizontal -->
  <line x1="16" y1="199" x2="464" y2="199" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- DISPOSITIVO INFERIOR: PORTA AUTOALINHADA SGT -->
  <text x="16" y="219" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#065f46">Porta autoalinhada SGT (poli p<tspan baseline-shift="super" font-size="75%">+</tspan>)</text>
  <rect x="260" y="204" width="206" height="22" rx="3" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="363" y="219" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#065f46">
    L<tspan baseline-shift="sub" font-size="75%">ov,SGT</tspan> = L<tspan baseline-shift="sub" font-size="75%">diff,lat</tspan> (&#916;L<tspan baseline-shift="sub" font-size="75%">align</tspan> = 0)
  </text>

  <!-- Substrato n -->
  <rect x="38" y="284" width="338" height="38" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="207" y="315" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1e3a8a">Substrato Si tipo n</text>

  <!-- Fonte e Dreno p+ autoalinhados -->
  <rect x="46" y="284" width="90" height="22" fill="#ffedd5" stroke="#c2410c" stroke-width="1.3"/>
  <text x="91" y="299" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#7c2d12">Fonte p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <rect x="266" y="284" width="92" height="22" fill="#ffedd5" stroke="#c2410c" stroke-width="1.3"/>
  <text x="312" y="299" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#7c2d12">Dreno p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <!-- Profundidade x_j inferior -->
  <line x1="28" y1="284" x2="44" y2="284" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="28" y1="306" x2="44" y2="306" stroke="#475569" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="32" y1="286" x2="32" y2="304" stroke="#334155" stroke-width="1.2" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
  <text x="20" y="299" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#0f172a">x<tspan baseline-shift="sub" font-size="75%">j</tspan></text>

  <!-- Oxido fino de porta SGT -->
  <rect x="118" y="274" width="166" height="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="266" y="274" width="18" height="10" fill="#10b981" fill-opacity="0.38" stroke="#059669" stroke-width="1.2"/>

  <!-- Porta de Polissilicio p+ + 3D W -->
  <polygon points="118,254 134,242 300,242 284,254" fill="#ffe4e6" stroke="#9f1239" stroke-width="1.2"/>
  <polygon points="284,254 300,242 300,262 284,274" fill="#fda4af" stroke="#9f1239" stroke-width="1.2"/>
  <rect x="118" y="254" width="166" height="20" fill="#fecdd3" stroke="#9f1239" stroke-width="1.3"/>
  <text x="201" y="268" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#881337">Polissilício p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <!-- Cota W no SGT -->
  <line x1="292" y1="274" x2="308" y2="262" stroke="#1e293b" stroke-width="1.2" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)"/>
  <text x="316" y="272" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">W</text>

  <!-- Cota t_ox no SGT -->
  <line x1="380" y1="274" x2="404" y2="274" stroke="#0891b2" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="380" y1="284" x2="404" y2="284" stroke="#0891b2" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="398" y1="262" x2="398" y2="272" stroke="#0891b2" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
  <line x1="398" y1="296" x2="398" y2="286" stroke="#0891b2" stroke-width="1.2" marker-end="url(#arrow-dark)"/>
  <text x="410" y="283" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" fill="#0e7490">t<tspan baseline-shift="sub" font-size="75%">ox</tspan></text>

  <!-- Cota L_ov,SGT reduzido -->
  <line x1="266" y1="284" x2="266" y2="234" stroke="#059669" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="284" y1="254" x2="284" y2="234" stroke="#059669" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="267" y1="238" x2="283" y2="238" stroke="#059669" stroke-width="1.5"/>
  <line x1="286" y1="238" x2="306" y2="238" stroke="#059669" stroke-width="1.1"/>
  <text x="310" y="242" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#065f46">L<tspan baseline-shift="sub" font-size="75%">diff,lat</tspan> (&#8722;60% a &#8722;80% C<tspan baseline-shift="sub" font-size="75%">ov</tspan>)</text>
</svg>
