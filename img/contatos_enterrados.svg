<svg xmlns="http://www.w3.org/2000/svg" width="465" height="365" viewBox="0 0 465 365">
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="465" height="365" fill="#ffffff"/>

  <rect x="4" y="4" width="457" height="357" rx="5" fill="#fafafa" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="4" y="4" width="457" height="30" rx="5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="232" y="24" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#0f172a">Corte transversal: Contato Convencional vs. Enterrado</text>

  <!-- TOPO: CONTATO CONVENCIONAL -->
  <text x="232" y="54" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Contato Convencional (2 janelas verticais + ponte de Al)</text>

  <!-- Cota largura convencional -->
  <line x1="74" y1="82" x2="74" y2="66" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="372" y1="82" x2="372" y2="66" stroke="#dc2626" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="76" y1="73" x2="370" y2="73" stroke="#dc2626" stroke-width="1.4" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="223" y="69" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#b91c1c">Área extensa (folgas litográficas + 2 vias)</text>

  <!-- Substrato Si n -->
  <rect x="30" y="148" width="405" height="36" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="290" y="171" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e3a8a">Substrato Si tipo n</text>

  <!-- Difusao p+ -->
  <rect x="40" y="148" width="170" height="22" fill="#ffedd5" stroke="#c2410c" stroke-width="1.3"/>
  <text x="125" y="163" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#7c2d12">Difusão p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <!-- Oxido isolante com janela 1 aberta (x=92..132) -->
  <rect x="30" y="132" width="62" height="16" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="132" y="132" width="303" height="16" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>

  <!-- Polissilicio p+ sobre o oxido -->
  <rect x="240" y="118" width="164" height="14" fill="#fecdd3" stroke="#9f1239" stroke-width="1.3"/>
  <text x="278" y="129" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#881337">Poli p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <!-- Oxido superior com janela 2 aberta (x=312..352) -->
  <rect x="232" y="102" width="80" height="16" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="352" y="102" width="60" height="16" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>

  <!-- Ponte de Aluminio descendo pelas 2 vias -->
  <polygon points="74,82 372,82 372,102 352,102 352,118 312,118 312,102 132,102 132,148 92,148 92,102 74,102" fill="#cbd5e1" stroke="#334155" stroke-width="1.4"/>
  <text x="223" y="96" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#0f172a">Ponte de Alumínio</text>
  <text x="112" y="123" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1e293b">Via 1</text>
  <text x="332" y="114" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#1e293b">Via 2</text>

  <!-- Separador horizontal -->
  <line x1="16" y1="191" x2="449" y2="191" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- BASE: CONTATO ENTERRADO (FAGGIN) -->
  <text x="16" y="210" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" fill="#065f46">Contato Enterrado (aplicado por Faggin no 4004)</text>

  <!-- Guias de comparacao -->
  <line x1="74" y1="221" x2="74" y2="241" stroke="#059669" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="224" y1="221" x2="224" y2="241" stroke="#059669" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="372" y1="191" x2="372" y2="241" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="3,2"/>

  <!-- Cota largura reduzida (~50% menor) -->
  <line x1="76" y1="231" x2="222" y2="231" stroke="#059669" stroke-width="1.6" marker-start="url(#arrow-emerald)" marker-end="url(#arrow-emerald)"/>
  <line x1="224" y1="231" x2="372" y2="231" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="342" y="253" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">~50% menos área celular</text>

  <!-- Substrato Si n -->
  <rect x="30" y="313" width="405" height="38" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="326" y="337" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1e3a8a">Substrato Si tipo n</text>

  <!-- Juncao omica p+ continua -->
  <rect x="52" y="313" width="180" height="24" fill="#ffedd5" stroke="#c2410c" stroke-width="1.4"/>
  <text x="142" y="329" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#7c2d12">Junção ôhmica p<tspan baseline-shift="super" font-size="75%">+</tspan> contínua</text>

  <!-- Oxido aberto antes do polissilicio (janela x=118..178) -->
  <rect x="30" y="297" width="88" height="16" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
  <rect x="178" y="297" width="257" height="16" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>

  <!-- Polissilicio p+ em contato direto com o substrato -->
  <polygon points="92,275 224,275 224,297 178,297 178,313 118,313 118,297 92,297" fill="#fecdd3" stroke="#9f1239" stroke-width="1.4"/>
  <text x="164" y="290" font-family="DejaVu Sans, Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#881337">Polissilício p<tspan baseline-shift="super" font-size="75%">+</tspan></text>

  <!-- Oxido superior continuo -->
  <rect x="84" y="263" width="148" height="12" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>

  <!-- Nota explicativa do fluxo -->
  <rect x="246" y="263" width="202" height="44" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.1"/>
  <text x="347" y="280" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#065f46">Janela aberta antes do poli,</text>
  <text x="347" y="297" font-family="DejaVu Sans, Arial, sans-serif" font-size="11.5" text-anchor="middle" fill="#065f46">difusão de boro une poli e Si</text>
</svg>
